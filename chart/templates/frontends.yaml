{{- if .Values.frontend.enabled }}
{{- $root := . -}}
{{- $fe := .Values.frontend -}}
# SvelteKit SSR micro-frontend zones (P5). One Deployment + Service per .Values.frontend.apps entry, built
# from the ONE parametrized .docker/frontend.dockerfile (image lance-<name>:tag). The catch-all `home`
# serves "/"; each domain zone is pinned to its base path /<name> in svelte.config.js and is TCP-probed (a
# domain zone's "/" is a 404 under its base, so no httpGet). Mirrors rask/chart/templates/frontends.yaml.
# The Ingress path-routes /<name> → this Service (ingress.yaml); the nginx gateway stays backend-only.
# Every zone shares one env (lance.frontendEnv) — the "auth/secret similar in every MFE" seam.
#
# NAMING: k8s objects are named/labelled `web-<name>` (NOT the bare zone name) — the bare `<name>` would
# collide with backend services that share a name (e.g. a `lineage` zone vs the backend lineage
# Deployment/Service `lance-lineage` + `component: lineage`): duplicate object names make the release
# undeployable, and a shared component selector cross-wires the backend Service onto SvelteKit pods. The
# `web-` prefix keeps the frontend tier disjoint from every backend component. (Image name is unaffected —
# it stays lance-<name>:tag.)
{{- range $fe.apps }}
{{- $comp := printf "web-%s" .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" $root }}-{{ $comp }}
  labels:
    {{- include "lance.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  replicas: {{ $fe.replicas | default 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: {{ $comp }}, app.kubernetes.io/instance: {{ $root.Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $comp }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.lifecycle.terminationGracePeriodSeconds }}
      {{- if $root.Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" $comp | nindent 6 }}
      {{- end }}
      {{- if $root.Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" $root }}-sa-web
      {{- end }}
      containers:
        - name: {{ .name }}
          image: "{{ include "lance.frontendImage" (list $root .name) }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- include "lance.securityContext" $root | nindent 10 }}
          {{- include "lance.preStop" $root | nindent 10 }}
          env:
            {{- include "lance.frontendEnv" $root | nindent 12 }}
            {{- if and $fe.oidc.enabled $root.Values.auth.enabled }}
            # Split-horizon OIDC (same gating as lance.frontendEnv's OIDC block): the zones' SERVER-side
            # fetches (discovery doc, token POST) go to the in-cluster Dex Service — the public issuer may
            # only resolve for browsers. The BROWSER-facing authorize URL and the iss expectation keep the
            # public OIDC_ISSUER; the BFF rewrites the discovered (public) endpoints onto this base.
            # (The old AUTH_GATE cookie-presence env is gone: the media/annotator zones now run the real
            # @rask/api/bff makeSessionHandle like every other zone — one gate, derived from this config.)
            - { name: OIDC_INTERNAL_ISSUER, value: "http://{{ include "lance.fullname" $root }}-dex:5556/dex" }
            {{- end }}
            {{- if and $root.Values.media.enabled (or (eq .name "media") (eq .name "annotator")) }}
            # The media plane's upstreams for these zones' BFF proxy routes (/<zone>/api/* → the three
            # lance-media Services): the zone map their retired thin server used, now resolved in-release.
            - { name: VIEWER_API, value: "http://{{ include "lance.fullname" $root }}-viewer:{{ $root.Values.media.services.viewer.port }}" }
            - { name: SEARCH_API, value: "http://{{ include "lance.fullname" $root }}-search:{{ $root.Values.media.services.search.port }}" }
            - { name: ANNOTATOR_API, value: "http://{{ include "lance.fullname" $root }}-annotator:{{ $root.Values.media.services.annotator.port }}" }
            {{- if and (eq .name "annotator") $root.Values.runners.enabled }}
            # Mirror of the annotator SERVICE's runner seams (media.yaml) onto the zone's web pod:
            # its /api/config endpoint reads these to render the honest "mocked — needs runner"
            # chip, so the chip's truth must track the same values switch as the service env —
            # found live 2026-07-24 (runner deployed, service wired, chip still claimed mock).
            - { name: MEDIA_ASSIST_URL, value: "http://{{ include "lance.fullname" $root }}-assist:{{ $root.Values.runners.assist.port }}/v1/assist" }
            {{- if $root.Values.runners.jobsUrl }}
            - { name: MEDIA_JOBS_URL, value: {{ $root.Values.runners.jobsUrl | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
          ports: [{ name: http, containerPort: 3000 }]
          {{- include "lance.tcpProbes" "http" | nindent 10 }}
          resources: {{- include "lance.resources" (dict "root" $root "comp" $comp) | nindent 12 }}
          volumeMounts:
            {{- include "lance.tmpMount" $root | nindent 12 }}
      volumes:
        {{- include "lance.tmpVolume" $root | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" $root }}-{{ $comp }}
  labels:
    {{- include "lance.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  ports: [{ name: http, port: {{ $fe.service.port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: {{ $comp }}, app.kubernetes.io/instance: {{ $root.Release.Name }} }
{{- end }}
{{- if and $fe.oidc.enabled $root.Values.auth.enabled }}
---
# The session-cookie sealing key (AES-256-GCM) + the confidential Dex client secret, shared by every zone
# (they all read the origin-wide cookie; home also exchanges the code). A Secret, not plaintext env, so
# prod-render's zero-plaintext check holds. Operator-provided + stable (rotating logs everyone out). Gated
# on auth.enabled too — the consuming OIDC env only renders under auth.enabled, so no orphan Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-frontend-session
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
data:
  secret: {{ $fe.oidc.sessionSecret | b64enc | quote }}
  clientSecret: {{ .Values.dex.clientSecret | b64enc | quote }}
{{- end }}
{{- end }}
