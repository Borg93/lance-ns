[project]
name = "lance-ns"
version = "0.1.0"
description = "Lance Namespace REST Catalog (FastAPI over native pylance DirectoryNamespace, MinIO)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # 9.0.0 (released; verified on PyPI 2026-07-26 — it carries the `otel` extra). The extra is what
    # activates `common/lance_metrics.py`: the bridge and its five lifespan hooks were pre-wired at the
    # 8.x pin as a guarded no-op, because `lance.otel` did not exist before 9.0. With it, Lance's own
    # Rust-side object-store/IO metrics register on the MeterProvider that `opentelemetry-instrument`
    # already installs in every deployed service, so they flow down the existing OTLP → Collector →
    # GreptimeDB path with no new configuration (#114).
    "pylance[otel]>=9.0.0",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "lance-namespace>=0.9.0",
    "lance-namespace-urllib3-client>=0.9.0",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "openfga-sdk>=0.9",
    "tenacity>=9.1.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # boto3 powers STS credential vending (catalog/core/vending.py StsVendor → AssumeRole + session policy).
    # Only used when LANCE_VENDING_MODE=sts; lazily imported, but must ship in the image for that path.
    "boto3>=1.34",
    "dapr>=1.18.1",
    "dapr-ext-fastapi>=1.18.1",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-psycopg>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "opentelemetry-instrumentation-grpc>=0.64b0",
    "pillow>=12.3.0",
    # lance-media fold (viewer/search/annotator + common/lancekit). Light deps only —
    # model stacks stay in runners/*/pyproject (their own images), and ray[data] +
    # lance-ray arrive with the pipeline step, not here.
    "lancedb>=0.34.0",
    "python-multipart>=0.0.9",
    "lance-graph>=0.5.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "requests>=2.32",
    "ruff>=0.6",
    "moto[s3,server]>=5",
    # The OpenLineage spec gate (tests/unit/test_openlineage_spec_conformance.py) needs both: the client
    # for the authoritative facet _schemaURLs, jsonschema to validate our hand-built RunEvents against the
    # vendored 2-0-2 core schema. jsonschema was already resolvable as a moto transitive — declared here
    # because the gate depends on it directly and must not break when moto's tree changes.
    "openlineage-python>=1.50.0",
    "jsonschema>=4.26",
    "duckdb>=1.4",
]

# pylance 8.0.0 caps lance-namespace<0.9 in its metadata (7.x capped <0.8), but at
# runtime it works with lance-namespace 0.9.x — same conservative-cap story as 7.x,
# verified again: native DirectoryNamespace + branch ops + create/list all function.
# We override the cap so the catalog tracks the latest namespace spec. pylance ships
# no macOS x86_64 wheel, so resolution is restricted to Linux (devcontainer + Docker)
# for a clean, reproducible lockfile across teammates / CI / Codespaces.
[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "lance-namespace>=0.9.0",
    "lance-namespace-urllib3-client>=0.9.0",
]

[tool.fastapi]
entrypoint = "catalog.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
# Service packages live under services/ (catalog, lineage, medallion, compaction, common); "." keeps
# tests/ + scripts/ importable. Each service imports peers' shared code via `common`, never `app`.
pythonpath = ["services", "."]
markers = [
    "e2e: end-to-end tests against a running server (set LANCE_REST_E2E_URL)",
    "observability: e2e tests against the deployed kind stack — catalog + lineage + GreptimeDB (set LANCE_E2E_*_URL)",
    "medallion: e2e tests for the event-driven medallion cascade — lance-ray + lineage (set LANCE_E2E_*_URL)",
    "gateway: e2e tests for the API gateway (Dapr service-invocation routing) — set LANCE_E2E_GATEWAY_URL",
    "compaction: e2e tests for the compaction/GC sweep against real Lance datasets — set LANCE_E2E_*_URL",
    "cas: object-store conditional-write (compare-and-swap) validation against the deployed store — set LANCE_E2E_S3_*",
    "media: e2e tests for the MEDIA lane of the cascade (ingest-media → derived silver) — set LANCE_E2E_*_URL",
    "governed_union: e2e for the FULL governed union (auth+FGA+compute+quality ON): allow path, FGA-deny→DROP, quality-block, media — make e2e-governed-union",
    "ray_train: e2e for the Ray TRAIN path — governed train→candidate→blessed + reproducibility capture (pinned versions, OTLP metrics, validator gate) — make e2e-ray-train",
    "ray_batch: e2e for the Ray BATCH path — distributed Lance write/index/evolve/compact on a real KubeRay cluster — make e2e-ray-batch",
    "duckdb: e2e proving DuckDB's core lance extension reads lance-ns Lance datasets over the deployed S3 store — set LANCE_E2E_S3_*",
    "media_catalog: e2e for the folded lance-media annotations plane against a live catalog — set MEDIA_CATALOG_URL",
    "user_state: e2e for per-subject user state on the Dapr state store against a live catalog — set LANCE_E2E_CATALOG_URL",
]

[tool.ty.environment]
python-version = "3.13"
root = ["services", "."]

[tool.ty.src]
# The vulture whitelist is, by design, a file of BARE NAMES — that is how vulture marks a symbol as "used".
# To a type-checker every line is an unresolved reference, so `ty check` fails on it. It is not real code and
# is never imported; exclude it rather than contorting the file into something vulture no longer understands.
# src/ratch + runners are the folded lance-media pipeline/runner trees: unwired (no service imports them,
# not in any image) and their deps are deliberately absent here — runners are sealed-env model workers
# (their own pyprojects → their own images; lance-audio excluded them from ty for the same reason), and
# ratch's ray[data]/lance-ray/typer stack lands with the pipeline step. Include ratch when that wiring lands.
exclude = [".vulture-whitelist.py", "src/ratch", "runners"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
