# Production overlay — apply ON TOP of values.yaml:
#   helm upgrade lance-ns ./chart -f chart/values.yaml -f chart/values-prod.yaml
#
# It flips the safe-by-default-OFF prod switches and is the place to externalize the durable/stateful
# tier. See docs/DURABILITY.md for the tier model (ephemeral compute / durable data / external-in-prod).
# Switches set here are wired today; the EXTERNALIZE stanzas at the bottom are commented because they
# also need the matching external-endpoint chart hooks (tracked as follow-up) before they do anything.

# --- App images: set a real release tag before applying (never :dev/:latest in prod). The chart's image
# helper FAILS the render on an empty tag, so DON'T ship tag:"" here — uncomment and fill these. -------
image:
  pullPolicy: IfNotPresent
  # catalog: { tag: v1.2.3 }   # the released catalog/lineage image tag
  # web:     { tag: v1.2.3 }   # the released web image tag

# --- Governance ON — Dex OIDC + OpenFGA. auth.enabled governs the catalog + lineage; medallion.fgaEnabled
# additionally governs the raw→bronze→silver→gold movers' WRITE path (can_create_table / can_promote).
# PREREQUISITE: seed the mover-identity grants first (scripts/seed_medallion_fga.sh) or the movers fail
# closed and the pipeline stalls. ------------------------------------------------------------------
auth:
  enabled: true
  lockRootCreate: true # prod: a token alone can't create root namespaces — needs a warehouse create grant
medallion:
  fgaEnabled: true
  # 1, NOT 2 (audit 2026-07-14 claim-drift #2): the mover single-flight lock is PROCESS-LOCAL
  # (transform.py), so 2 replicas can race concurrent overwrites of the same stage dataset.
  # Raise only after a cross-pod lock ships.
  moverReplicas: 1
  producer:
    expose: false # /produce is the unauthenticated demo entry — the prod head fires from real raw writes

# --- HA (P3): multi-replica stateless services + a PodDisruptionBudget. Stateful HA (AGE/RustFS) is the
# operators' job in rask (CNPG / rustfs-operator), not here. Optionally also set autoscaling.enabled. -----
services:
  catalog:
    replicas: 2
  lineage:
    replicas: 2
    demoData: false # the /demo data-peek router carries no OIDC/FGA guard — never mount it in prod
    # #4's durability ON where it matters (audit claim-drift #1: was OFF in every shipped profile
    # while documented "live-verified" — the exact loss window it exists to close stood open).
    outbox:
      enabled: true
    reconcile:
      enabled: true
gateway:
  replicas: 2
web:
  replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# OpenFGA is the authz chokepoint — every governed catalog write, every lineage read, and all four movers'
# WRITE path fail CLOSED through it, so a single drained/OOMed replica 503s the whole estate until it
# reschedules. Run the subchart's supported 3 replicas (kind pinned it to 1) + size its resources. Its PDB
# + pod anti-affinity are P2 (they need the subchart's own label selector). (prod-readiness P1)
openfga:
  replicaCount: 3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Network isolation: default-deny + DNS egress + the EXCLUSIVE OpenBao-ingress lock (only secret-consuming
# app pods may reach openbao:8200). The chart ships the full, correct impl (templates/network-policy.yaml);
# it was simply never enabled on the documented prod overlay — the security audit's headline gap. REQUIRES a
# policy-enforcing CNI (Calico/Cilium): kind's default kindnet SILENTLY ignores NetworkPolicy, so this can't
# be proven on the demo — verify with the negative-isolation probe (docs/KIND-RUNBOOK.md) on the real
# cluster as a prod acceptance step. (prod-readiness P1)
networkPolicy:
  enabled: true

# Per-workload resource tiers (P2): the shared 1-CPU/512Mi default sizes the stateful stores + the Arrow-
# IPC-buffering catalog like stateless request pods. Give the memory-heavy workloads a real limit (the rest
# keep resources.default). Requests reserve scheduler headroom. Movers/lineage stay on default until load
# data says otherwise. (prod-readiness P2)
resources:
  catalog:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi } # a 256MiB Arrow-IPC body + pyarrow decode overhead needs >512Mi
  age:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi } # dual-purpose store: the lineage graph AND OpenFGA's datastore
  rustfs:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi } # the lakehouse + observability object store under real load

# --- Backups (P4): ON for the SELF-CONTAINED in-cluster-prod path (in-cluster AGE + RustFS PVC). If you
# externalize to CloudNativePG / rustfs-operator (the rask path), set BOTH back to false — the operators do
# PITR/scheduled backups + snapshots better. (snapshotClassName must be a real CSI VolumeSnapshotClass.) ----
backups:
  pgDump:
    enabled: true
  volumeSnapshot:
    enabled: true
    snapshotClassName: "" # set your cluster's CSI VolumeSnapshotClass

# --- Secrets: the SEALED, file-backed OpenBao (no fixed root token; an operator must init + unseal).
# NOTE devMode=false is the prod signal: the render now FAILS unless age.password + rustfs.secretKey are
# overridden (or externalSecrets.enabled hands the Secrets to the external-secrets operator) — the
# well-known dev credentials must not reach a prod cluster (infra-credentials.yaml guard). -----------
openbao:
  devMode: false

# --- Dapr: the app-API token is the auth secret for the sidecar-delivered routes — MUST be overridden.
# The placeholder below FAILS the render on purpose (dapr-app-token.yaml guard): pass a real value with
# --set dapr.appToken=... (or your values pipeline) — never commit it to this file.
dapr:
  appToken: "REPLACE-ME-with-a-real-secret" # source from OpenBao / an external secret, not this file
  # Dapr control-plane HA: multi-replica operator / placement / scheduler + Sentry (the mTLS CA that sits in
  # the sidecar cert-renewal path). kind ran single-node; in prod a Sentry node-drain/OOM eventually breaks
  # sidecar identity renewal → all service-invocation + pub/sub across the mesh stops. (prod-readiness P1)
  global:
    ha:
      enabled: true
  dashboard:
    enabled: false # don't expose the Dapr control-plane UI in prod

# --- Durable lakehouse storage. persistence is already on by default; SIZE it for prod (the 2Gi dev
# default is far too small — this one volume holds the lakehouse AND 14d of full-sampling observability).
# Set a snapshot-capable storageClassName for the documented VolumeSnapshot backups. ----------------
rustfs:
  storage: 200Gi
  persistence:
    enabled: true
    storageClassName: "" # e.g. a CSI class that supports VolumeSnapshot + encryption

# --- Compaction/GC at a real cadence (not the 120s demo sweep) -------------------------------------
compaction:
  schedule: "0 */30 * * * *" # every 30 min
  olderThanDays: 7

# --- Ingress fronts the gateway in prod (kind used a port-forward). Wired in templates/ingress.yaml →
# set your className / host / TLS. ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx # match your cluster's Ingress controller (nginx / traefik / …)
  host: "" # e.g. lance.example.com

# --- Observability edge auth (§5e): nginx auth_basic on the public /greptime/ + /perses/ Ingress routes.
# BOTH are otherwise UNAUTHENTICATED — GreptimeDB exposes raw SQL/ingest on :4000 and Perses is the
# dashboard — and the gateway proxies them through the prod Ingress, so without this they are publicly
# reachable. The htpasswd line is an INFRA-tier credential: supply it OUT-OF-BAND (never in this file) via
# `--set observability.edgeAuth.htpasswd=…` sourced from OpenBao / external-secrets (an apr1/bcrypt hash,
# e.g. `htpasswd -nbB observer <pw>`). The render FAILS CLOSED if enabled with no htpasswd (like the other
# prod-secret guards). Full GreptimeDB `auth.enabled` (client-cred propagation to the OTLP exporters /
# Vector / the Perses datasource) + Perses OIDC via Dex are the documented follow-on.
observability:
  edgeAuth:
    enabled: true
  # Alerting engine ON (P3b): vmalert evaluates the proven rules against GreptimeDB + routes via Alertmanager.
  # Set webhookUrl (Slack/PagerDuty) out-of-band to actually page — empty groups alerts but pages nowhere.
  alerting:
    enabled: true
  # Infra-tier metrics ON (P3c): vmagent scrapes the Dapr sidecars into GreptimeDB so a consumer-wedge
  # (silent in the app metrics) becomes queryable + fires DaprConsumerWedge. Kept off in the kind e2e (2c/7G).
  infraMetrics:
    enabled: true

# ===================================================================================================
# EXTERNALIZE the durable/managed tier (tier 3 in docs/DURABILITY.md). Disable the in-cluster component
# AND set its external endpoint — the apps then connect to the managed service (verified: no in-cluster
# DNS leaks into app env). Uncomment per service.
# ---------------------------------------------------------------------------------------------------
# rustfs:                                            # managed S3 for the lakehouse + observability bucket
#   enabled: false
#   externalEndpoint: https://s3.us-east-1.amazonaws.com
# age:                                               # managed Postgres (RDS / Cloud SQL / CNPG)
#   enabled: false
#   externalHost: my-pg.internal
#   user: lance                                      # match the managed DB's role/password/dbs
#   password: REPLACE-ME
# openfga:                                           # the openfga subchart's datastore points at the same DB
#   datastore:
#     uri: postgres://lance:REPLACE-ME@my-pg.internal:5432/openfga?sslmode=require
# openbao:                                           # external Vault / cloud KMS (operator populates the Secret)
#   enabled: false
#   externalAddr: https://vault.internal:8200
# nats:                                              # managed/clustered NATS JetStream (the in-cluster single
#   enabled: false                                   # node is a SPOF: bus down = no lineage ingest, no cascade)
#   externalUrl: nats://nats.internal:4222
#   streamReplicas: 3                                # raft-replicated streams (needs the 3+ node cluster)
# observability:                                     # ship telemetry to an off-cluster collector
#   enabled: false
#   externalOtlpEndpoint: http://otel-collector.observability:4318/v1/otlp
