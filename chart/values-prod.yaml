# Production overlay — apply ON TOP of values.yaml:
#   helm upgrade lance-ns ./chart -f chart/values.yaml -f chart/values-prod.yaml
#
# It flips the safe-by-default-OFF prod switches and is the place to externalize the durable/stateful
# tier. See docs/DURABILITY.md for the tier model (ephemeral compute / durable data / external-in-prod).
# Switches set here are wired today; the EXTERNALIZE stanzas at the bottom are commented because they
# also need the matching external-endpoint chart hooks (tracked as follow-up) before they do anything.

# --- App images: set a real release tag before applying (never :dev/:latest in prod). The chart's image
# helper FAILS the render on an empty tag, so DON'T ship tag:"" here — uncomment and fill these. -------
image:
  pullPolicy: IfNotPresent
  # catalog: { tag: v1.2.3 }   # the released catalog/lineage image tag
  # web:     { tag: v1.2.3 }   # the released web image tag

# --- Governance ON — Dex OIDC + OpenFGA. auth.enabled governs the catalog + lineage; medallion.fgaEnabled
# additionally governs the raw→bronze→silver→gold movers' WRITE path (can_create_table / can_promote).
# PREREQUISITE: seed the mover-identity grants first (scripts/seed_medallion_fga.sh) or the movers fail
# closed and the pipeline stalls. ------------------------------------------------------------------
auth:
  enabled: true
medallion:
  fgaEnabled: true
  moverReplicas: 2

# --- HA (P3): multi-replica stateless services + a PodDisruptionBudget. Stateful HA (AGE/RustFS) is the
# operators' job in rask (CNPG / rustfs-operator), not here. Optionally also set autoscaling.enabled. -----
services:
  catalog:
    replicas: 2
  lineage:
    replicas: 2
gateway:
  replicas: 2
web:
  replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# --- Backups (P4): ON for the SELF-CONTAINED in-cluster-prod path (in-cluster AGE + RustFS PVC). If you
# externalize to CloudNativePG / rustfs-operator (the rask path), set BOTH back to false — the operators do
# PITR/scheduled backups + snapshots better. (snapshotClassName must be a real CSI VolumeSnapshotClass.) ----
backups:
  pgDump:
    enabled: true
  volumeSnapshot:
    enabled: true
    snapshotClassName: "" # set your cluster's CSI VolumeSnapshotClass

# --- Secrets: the SEALED, file-backed OpenBao (no fixed root token; an operator must init + unseal) -
openbao:
  devMode: false

# --- Dapr: the app-API token is the auth secret for the sidecar-delivered routes — MUST be overridden
dapr:
  appToken: "REPLACE-ME-with-a-real-secret" # source from OpenBao / an external secret, not this file
  dashboard:
    enabled: false # don't expose the Dapr control-plane UI in prod

# --- Durable lakehouse storage. persistence is already on by default; SIZE it for prod (the 2Gi dev
# default is far too small — this one volume holds the lakehouse AND 14d of full-sampling observability).
# Set a snapshot-capable storageClassName for the documented VolumeSnapshot backups. ----------------
rustfs:
  storage: 200Gi
  persistence:
    enabled: true
    storageClassName: "" # e.g. a CSI class that supports VolumeSnapshot + encryption

# --- Compaction/GC at a real cadence (not the 120s demo sweep) -------------------------------------
compaction:
  schedule: "0 */30 * * * *" # every 30 min
  olderThanDays: 7

# --- Ingress fronts the gateway in prod (kind used a port-forward). Wired in templates/ingress.yaml →
# set your className / host / TLS. ------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx # match your cluster's Ingress controller (nginx / traefik / …)
  host: "" # e.g. lance.example.com

# ===================================================================================================
# EXTERNALIZE the durable/managed tier (tier 3 in docs/DURABILITY.md). Disable the in-cluster component
# AND set its external endpoint — the apps then connect to the managed service (verified: no in-cluster
# DNS leaks into app env). Uncomment per service.
# ---------------------------------------------------------------------------------------------------
# rustfs:                                            # managed S3 for the lakehouse + observability bucket
#   enabled: false
#   externalEndpoint: https://s3.us-east-1.amazonaws.com
# age:                                               # managed Postgres (RDS / Cloud SQL / CNPG)
#   enabled: false
#   externalHost: my-pg.internal
#   user: lance                                      # match the managed DB's role/password/dbs
#   password: REPLACE-ME
# openfga:                                           # the openfga subchart's datastore points at the same DB
#   datastore:
#     uri: postgres://lance:REPLACE-ME@my-pg.internal:5432/openfga?sslmode=require
# openbao:                                           # external Vault / cloud KMS (operator populates the Secret)
#   enabled: false
#   externalAddr: https://vault.internal:8200
# observability:                                     # ship telemetry to an off-cluster collector
#   enabled: false
#   externalOtlpEndpoint: http://otel-collector.observability:4318/v1/otlp
