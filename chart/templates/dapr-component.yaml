{{- if .Values.dapr.enabled }}
# Dapr pub/sub components — the catalog→lineage topic + the medallion triggers on NATS JetStream. The
# sidecar owns retry/backoff here (config, not app code); subscriptions are programmatic (each app
# serves GET /dapr/subscribe via dapr-ext-fastapi), so no declarative Subscription CRDs.
#
# PUBLISH-only component: the catalog (+ compaction when lineageEmit) publish through it. Consumer
# metadata (queue group / deliver policy) lives on the per-SUBSCRIBER components below, never here.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" . }}" }
    - { name: name, value: "lance-dapr" }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
{{- if .Values.compaction.lineageEmit }}
  - {{ .Values.compaction.daprAppId }} {{/* compaction publishes maintenance lineage only when lineageEmit is on */}}
{{- end }}
{{- /* One component PER SUBSCRIBER app-id (see the lance.subPubsub helper): queueGroupName makes that
     app's replicas a competing-consumer group (single delivery per app — without it every replica gets
     EVERY message: jetstream only sets a DeliverGroup when queueGroupName is non-empty), and it CANNOT
     live on one shared component because lineage and lance-ray both consume lineage.events.v1 — one
     shared queue group would split those messages across the two apps. deliverPolicy differs on
     purpose: `all` for lineage (a restart replays the retained stream into the idempotent MERGE ingest —
     that replay IS the outage-durability story), `new` for the cascade head + movers (a replayed
     168h of triggers would re-fire cascades / re-run compute; a trigger missed while a mover is down is
     accepted demo loss — the reconcile cron back-fills dataset writes; durable PULL consumers are the
     production follow-up, docs/RESILIENCE.md). Still no durableName: Dapr's durable PUSH consumer
     orphans on redeploy ("consumer name already in use"); the queue-group consumer is auto-cleaned. */}}
{{- $subscribers := list (dict "appId" .Values.services.lineage.daprAppId "deliverPolicy" "all") }}
{{- if .Values.medallion.enabled }}
{{- $subscribers = append $subscribers (dict "appId" .Values.medallion.producer.daprAppId "deliverPolicy" "new") }}
{{- range .Values.medallion.movers }}
{{- $subscribers = append $subscribers (dict "appId" .daprAppId "deliverPolicy" "new") }}
{{- end }}
{{- end }}
{{- range $subscribers }}
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "lance.subPubsub" (list $ .appId) }}
  labels: {{- include "lance.labels" $ | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "{{ include "lance.natsUrl" $ }}" }
    - { name: name, value: "lance-dapr-{{ .appId }}" }
    - { name: queueGroupName, value: {{ .appId | quote }} }
    - { name: deliverPolicy, value: {{ .deliverPolicy | quote }} }
    # backOff supersedes ackWait for redelivery timing (NATS consumer semantics): its FIRST value is the
    # effective ack window, so it must not undercut the slowest handler (a compute-on mover does real
    # S3 reads+writes) — a 1s first step would concurrently redeliver mid-handling even at 1 replica.
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "30s,60s,120s,300s" }
scopes:
  - {{ .appId }}
{{- end }}
{{- if include "lance.secretsViaDapr" . }}
---
# Dapr secret store fronting OpenBao / an external Vault (Vault-API compatible). Apps read secrets via
# their sidecar (GET /v1.0/secrets/lance-secrets/<name>) instead of plaintext env — the secret-handling
# fix. Renders for the in-cluster OpenBao OR an external Vault (openbao.externalAddr), so externalizing
# the store does not force the apps back to plaintext.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: lance-secrets
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - { name: vaultAddr, value: "{{ include "lance.vaultAddr" . }}" }
    {{- if and .Values.openbao.enabled .Values.openbao.devMode }}
    - { name: vaultToken, value: {{ .Values.openbao.devToken | quote }} }
    {{- else }}
    # Prod path: NOT the dev root token (it can't authenticate against an operator-initialized OpenBao).
    # The operator supplies a real, scoped token via this Kubernetes secret; Dapr resolves it through its
    # default k8s secret store. Create it out-of-band: kubectl create secret generic <release>-openbao-token
    # --from-literal=token=<bao-token>.
    - name: vaultToken
      secretKeyRef:
        name: {{ .Release.Name }}-openbao-token
        key: token
    {{- end }}
    - { name: enginePath, value: "secret" }
    # Dapr defaults vaultKVPrefix to "dapr", so it reads secret/data/dapr/<key>; our seed writes
    # secret/data/<key>. Drop the prefix so the path is the natural secret/data/<key> (the kv-v2 nuance).
    - { name: vaultKVUsePrefix, value: "false" }
    # TLS verification tracks the Vault address scheme: an https Vault (the openbao.externalAddr prod
    # path) is verified; skipVerify only for the plain-http in-cluster dev OpenBao (no TLS to verify).
    # An unconditional "true" would leave the component fronting EVERY app secret unverified in prod.
    - { name: skipVerify, value: {{ ternary "false" "true" (hasPrefix "https://" (include "lance.vaultAddr" .)) | quote }} }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
  - {{ .Values.services.lineage.daprAppId }}
{{- if .Values.compaction.enabled }}
  - {{ .Values.compaction.daprAppId }}
{{- end }}
{{- end }}
{{- end }}
