{{- if .Values.dapr.enabled }}
# Dapr pub/sub component — backs the catalog→lineage topic onto NATS JetStream. The sidecar owns
# retry/backoff/DLQ here (config, not app code). The lineage subscription is programmatic (the lineage
# app serves GET /dapr/subscribe via dapr-ext-fastapi), so no declarative Subscription CRD is needed.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ .Values.pubsub.name }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: pubsub.jetstream
  version: v1
  metadata:
    - { name: natsURL, value: "nats://{{ include "lance.natsHost" . }}:4222" }
    - { name: name, value: "lance-dapr" }
    # No durableName: Dapr's durable PUSH consumer orphans on every pod redeploy (the dead consumer's
    # deliver subject blocks the new pod with "consumer name already in use"). An ephemeral consumer is
    # auto-cleaned on disconnect and recreated cleanly — and ingest is idempotent (MERGE on run_id) so a
    # replay is a no-op. (Durable redelivery across a redeploy gap is the production-hardening follow-up:
    # a durable PULL consumer.)
    - { name: ackWait, value: "30s" }
    - { name: maxDeliver, value: "5" }
    - { name: backOff, value: "1s,5s,10s,30s,60s" }
# The catalog (publisher) + lineage (subscriber) + the medallion services (producer + movers) all
# publish/subscribe through this component — each app-id must be in scope or its sidecar can't see it.
scopes:
  - {{ .Values.services.catalog.daprAppId }}
  - {{ .Values.services.lineage.daprAppId }}
{{- if .Values.medallion.enabled }}
  - {{ .Values.medallion.producer.daprAppId }}
{{- range .Values.medallion.movers }}
  - {{ .daprAppId }}
{{- end }}
{{- end }}
{{- if .Values.openbao.enabled }}
---
# Dapr secret store fronting OpenBao (Vault-API compatible). Apps read secrets via their sidecar
# (GET /v1.0/secrets/lance-secrets/<name>) instead of plaintext env — the secret-handling fix.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: lance-secrets
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  type: secretstores.hashicorp.vault
  version: v1
  metadata:
    - { name: vaultAddr, value: "http://{{ include "lance.openbaoHost" . }}:{{ .Values.openbao.port }}" }
    {{- if .Values.openbao.devMode }}
    - { name: vaultToken, value: {{ .Values.openbao.devToken | quote }} }
    {{- else }}
    # Prod path: NOT the dev root token (it can't authenticate against an operator-initialized OpenBao).
    # The operator supplies a real, scoped token via this Kubernetes secret; Dapr resolves it through its
    # default k8s secret store. Create it out-of-band: kubectl create secret generic <release>-openbao-token
    # --from-literal=token=<bao-token>.
    - name: vaultToken
      secretKeyRef:
        name: {{ .Release.Name }}-openbao-token
        key: token
    {{- end }}
    - { name: enginePath, value: "secret" }
    # Dapr defaults vaultKVPrefix to "dapr", so it reads secret/data/dapr/<key>; our seed writes
    # secret/data/<key>. Drop the prefix so the path is the natural secret/data/<key> (the kv-v2 nuance).
    - { name: vaultKVUsePrefix, value: "false" }
    - { name: skipVerify, value: "true" }
scopes:
  - {{ .Values.services.catalog.daprAppId }}
  - {{ .Values.services.lineage.daprAppId }}
{{- end }}
{{- end }}
