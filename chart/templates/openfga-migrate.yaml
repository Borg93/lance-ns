{{- if .Values.openfga.enabled }}
# OpenFGA schema migration against the AGE Postgres (the chart's bundled migrate is broken in 0.3.9 —
# it fails to pass the datastore flags). Waits for Postgres (nc succeeds only once initdb has created
# the openfga db and TCP is open), then runs `openfga migrate` with explicit flags (idempotent). A
# post-install/upgrade hook with a low weight so it runs before the server settles.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-openfga-migrate
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-age
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "lance.ageConnectHost" . }} {{ .Values.age.port }}; do echo wait-age; sleep 3; done"]
      containers:
        - name: migrate
          # Same tag as the server (values.openfga.image.tag) so the migrated schema matches.
          image: "openfga/openfga:{{ .Values.openfga.image.tag | default "v1.8.0" }}"
          # The datastore DSN (carrying the AGE password) comes from a k8s Secret env, NOT a plaintext Job
          # arg — `openfga migrate` honours OPENFGA_DATASTORE_URI. The audit's 'password-bearing DSN
          # plaintext in the migrate Job args' fix.
          env:
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: openfga-datastore-uri }
          args:
            - migrate
            - --datastore-engine=postgres
{{- end }}
