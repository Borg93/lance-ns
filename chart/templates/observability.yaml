{{- if .Values.observability.enabled }}
# Jaeger all-in-one — the tracing backend + UI. Native OTLP receiver (4317 gRPC) so Dapr sidecars and
# the app SDKs export straight to it; the UI (16686) shows the catalog→Dapr→lineage distributed trace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.jaegerHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: jaeger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.observability.jaegerImage }}
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: ui, containerPort: 16686 }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources.default | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.jaegerHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports:
    - { name: otlp-grpc, port: {{ .Values.observability.otlpPort }}, targetPort: otlp-grpc }
    - { name: ui, port: {{ .Values.observability.uiPort }}, targetPort: ui }
  selector:
    app.kubernetes.io/component: jaeger
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.dapr.enabled }}
# Dapr tracing Configuration — sidecars annotated with dapr.io/config: lance-tracing export spans
# (service-invocation + pub/sub) over OTLP to Jaeger. This is the "observability component in Dapr".
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: lance-tracing
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  tracing:
    samplingRate: {{ .Values.observability.samplingRate | quote }}
    otel:
      endpointAddress: "{{ include "lance.jaegerHost" . }}:{{ .Values.observability.otlpPort }}"
      isSecure: false
      protocol: grpc
{{- end }}
{{- end }}
