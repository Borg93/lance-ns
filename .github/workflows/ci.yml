name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Linux-only lockfile)
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: |
          uvx ruff check services tests
          uvx ruff format --check services tests

      - name: Type-check (ty)
        run: uvx ty check

      # Unit + integration tests (our logic only) + the moto-S3 round-trip.
      # No external infra needed — moto runs an in-process S3 server, and the
      # auth/authz tests fake the OIDC verifier + fga.check. The `e2e` marker is
      # excluded here; the live stack runs in the `auth-e2e` job below.
      # `tests/unit` is included when present (guarded so CI is green before the
      # write-side unit suite lands).
      - name: Tests (unit + integration)
        run: |
          paths="tests/integration"
          [ -d tests/unit ] && paths="tests/unit $paths"
          uv run --no-sync pytest $paths -q -m "not e2e"

      # The Helm chart is a first-class deliverable (the whole stack deploys from it), so lint + a full
      # template render gate on every push — a broken template or values reference fails here, not at deploy.
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint + render
        run: |
          helm lint chart
          helm template chart >/dev/null

      # The OpenFGA authorization model is source-of-truth for who-can — gate its tests (7 types,
      # concentric rungs, the validator promote gate, create-on-parent) so a model edit can't regress access.
      - name: OpenFGA model test
        run: |
          FGA_V=0.6.4
          curl -fsSL "https://github.com/openfga/cli/releases/download/v${FGA_V}/fga_${FGA_V}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin fga
          fga model test --tests services/common/auth/model.fga.yaml

  # AGE-backed lineage e2e (§7): the graph repository's REAL Cypher runs against a real Apache AGE
  # Postgres — the unit fakes can't catch AGE dialect behavior (the int-vs-string $ver at-version
  # match, the RETURN-less DETACH DELETE prune, the functional-index DDL). Runs via the Dagger module
  # (AGE as a hermetic service container) so `make e2e-lineage` == `dagger call test-lineage` == this
  # job, byte-for-byte. Engine version pinned by dagger.json. Same fork-gating as auth-e2e.
  lineage-e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.20.3 BIN_DIR=/usr/local/bin sh

      - name: Lineage e2e (real AGE graph, hermetic via Dagger)
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call test-lineage

  # Gated live auth end-to-end: brings up the SQLite OpenFGA + Dex stack via
  # docker compose and runs scripts/auth_e2e.sh, which asserts APP-SIDE SEEDING
  # (create namespace/table -> owner + parent cascade) and a 403 for a second
  # user with no grant. GitHub-hosted ubuntu runners ship Docker + Compose v2,
  # so this is feasible in CI. Skipped on forked-PR runs (no infra guarantees /
  # to avoid untrusted-code docker builds) but always runs on branch pushes.
  auth-e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Linux-only lockfile)
        run: uv sync --frozen --all-groups

      - name: Show docker / compose versions
        run: |
          docker version
          docker compose version

      # Builds the server image, starts MinIO + SQLite OpenFGA + Dex, and runs
      # the full app-side-seeding assertion chain. The script tears the stack
      # down on exit (trap). A non-zero exit fails the job.
      # KEEP_STACK=1 leaves the stack up so the next step can collect logs on
      # failure; the always() cleanup below tears it down regardless of outcome.
      - name: Auth e2e (Dex + SQLite OpenFGA, app-side seeding)
        env:
          KEEP_STACK: "1"
        run: bash scripts/auth_e2e.sh

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -f .docker/docker-compose.yml \
                         -f .docker/docker-compose.auth.sqlite.yml logs --no-color || true

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f .docker/docker-compose.yml \
                         -f .docker/docker-compose.auth.sqlite.yml down -v || true
