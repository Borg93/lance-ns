# OpenFGA model tests for the Lance catalog authorization model.
#
# Self-contained: the `model` block below is the EXACT DSL kept in
# `app/auth/model.fga` (and hand-translated to `app/auth/model.json`). Keep all
# three in sync — when you edit the model, edit it here too, then re-run
# `fga model transform --input app/auth/model.fga --output app/auth/model.json`
# and `fga model test --tests app/auth/model.fga.yaml`.
#
# Proves what the app relies on, modelled on a MEDALLION layout
# (catalog:lance -> bronze/silver/gold namespaces -> tables), with persona ROLES
# granted per layer:
#   1. concentric cascade owner => writer => reader on every type (the table rungs
#      now include `or owner`, so a direct table owner is also writer+reader).
#   2. parent cascade DOWN the hierarchy: catalog -> namespace -> (nested ns) -> table.
#   3. `can_*` ACTION relations resolve to the right rung (reader/writer/owner) —
#      the app checks these, never the raw roles.
#   4. roles as first-class subjects: `role:X#assignee` granted on a layer reaches
#      every member, and inherits to that layer's tables.
#   5. a table/namespace WITHOUT a parent tuple is denied inheritance — the cascade
#      is tuple-driven, not name-prefix-driven (so grant_on_create MUST seed parent).
name: Lance catalog authorization model

model: |
  model
    schema 1.1

  type user

  type role
    relations
      define assignee: [user, role#assignee]

  type catalog
    relations
      define owner: [user, role#assignee]
      define writer: [user, role#assignee] or owner
      define reader: [user, role#assignee] or writer
      define can_get_metadata: reader
      define can_create_namespace: writer
      define can_create_table: writer

  type namespace
    relations
      define parent: [catalog, namespace]
      define owner: [user, role#assignee] or owner from parent
      define writer: [user, role#assignee] or owner or writer from parent
      define reader: [user, role#assignee] or writer or reader from parent
      define can_get_metadata: reader
      define can_list: reader
      define can_create_namespace: writer
      define can_create_table: writer
      define can_update_properties: writer
      define can_delete: owner

  type table
    relations
      define parent: [namespace]
      define owner: [user, role#assignee] or owner from parent
      define writer: [user, role#assignee] or owner or writer from parent
      define reader: [user, role#assignee] or writer or reader from parent
      define can_get_metadata: reader
      define can_read_data: reader
      define can_write_data: writer
      define can_alter: writer
      define can_commit: writer
      define can_rename: writer
      define can_drop: owner
      define can_deregister: owner

tuples:
  # --- catalog admin (root) ---------------------------------------------------
  - user: user:admin_amy
    relation: owner
    object: catalog:lance

  # --- medallion namespaces, each parented to the catalog ----------------------
  - user: catalog:lance
    relation: parent
    object: namespace:bronze
  - user: catalog:lance
    relation: parent
    object: namespace:silver
  - user: catalog:lance
    relation: parent
    object: namespace:gold

  # --- persona roles + members ------------------------------------------------
  - user: user:svc_ingest
    relation: assignee
    object: role:ingestion
  - user: user:dee
    relation: assignee
    object: role:data_engineer
  - user: user:ana
    relation: assignee
    object: role:analyst

  # --- per-layer role grants (the medallion access policy) ---------------------
  - user: role:ingestion#assignee   # ingestion writes raw bronze
    relation: writer
    object: namespace:bronze
  - user: role:data_engineer#assignee  # engineers read bronze, write silver
    relation: reader
    object: namespace:bronze
  - user: role:data_engineer#assignee
    relation: writer
    object: namespace:silver
  - user: role:analyst#assignee     # analysts read curated gold
    relation: reader
    object: namespace:gold

  # --- tables, each linked to its layer namespace ------------------------------
  - user: namespace:bronze
    relation: parent
    object: table:bronze$images
  - user: namespace:silver
    relation: parent
    object: table:silver$features
  - user: namespace:gold
    relation: parent
    object: table:gold$metrics

  # --- a nested namespace under bronze, to prove ns->ns cascade ----------------
  - user: namespace:bronze
    relation: parent
    object: namespace:bronze$domain1
  - user: namespace:bronze$domain1
    relation: parent
    object: table:bronze$domain1$raw

  # NOTE: table:bronze$orphan deliberately has NO parent tuple — see deny tests.

tests:
  - name: catalog admin cascades to every layer, namespace, nested ns and table
    check:
      - user: user:admin_amy
        object: catalog:lance
        assertions: { owner: true, can_create_namespace: true }
      - user: user:admin_amy
        object: namespace:bronze
        assertions: { owner: true, can_delete: true, can_create_table: true }
      - user: user:admin_amy
        object: namespace:bronze$domain1   # nested ns inherits from bronze -> catalog
        assertions: { owner: true, can_delete: true }
      - user: user:admin_amy
        object: table:bronze$images
        assertions: { owner: true, can_drop: true, can_write_data: true, can_read_data: true }
      - user: user:admin_amy
        object: table:bronze$domain1$raw   # two hops down still owned
        assertions: { owner: true, can_drop: true }

  - name: ingestion role can write bronze tables but not own them (writer rung)
    check:
      - user: user:svc_ingest
        object: namespace:bronze
        assertions: { writer: true, owner: false, can_create_table: true }
      - user: user:svc_ingest
        object: table:bronze$images
        assertions:
          can_write_data: true   # writer
          can_read_data: true    # writer => reader
          can_alter: true        # writer
          can_drop: false        # owner-only
          can_deregister: false  # owner-only
      - user: user:svc_ingest    # no grant on other layers
        object: table:gold$metrics
        assertions: { can_read_data: false, can_write_data: false }

  - name: data_engineer reads bronze, writes silver (multi-layer role)
    check:
      - user: user:dee
        object: table:bronze$images
        assertions: { can_read_data: true, can_write_data: false }   # reader on bronze
      - user: user:dee
        object: table:silver$features
        assertions: { can_read_data: true, can_write_data: true, can_drop: false }  # writer on silver
      - user: user:dee
        object: table:bronze$domain1$raw   # reader inherited through nested ns
        assertions: { can_read_data: true, can_write_data: false }

  - name: analyst reads only curated gold
    check:
      - user: user:ana
        object: table:gold$metrics
        assertions: { can_read_data: true, can_get_metadata: true, can_write_data: false }
      - user: user:ana
        object: table:bronze$images
        assertions: { can_read_data: false }

  - name: a table without a parent tuple denies inheritance (cascade needs the tuple)
    check:
      - user: user:admin_amy   # even the catalog owner cannot reach an unlinked table
        object: table:bronze$orphan
        assertions: { owner: false, can_read_data: false, can_drop: false }

  - name: list_objects — tables each persona can read (drives GET /v1/table filtering)
    list_objects:
      - user: user:admin_amy
        type: table
        assertions:
          can_read_data:
            - table:bronze$images
            - table:silver$features
            - table:gold$metrics
            - table:bronze$domain1$raw
      - user: user:svc_ingest
        type: table
        assertions:
          can_write_data:
            - table:bronze$images
            - table:bronze$domain1$raw   # writer cascades bronze -> bronze$domain1 -> its tables
      - user: user:ana
        type: table
        assertions:
          can_read_data:
            - table:gold$metrics

  - name: list_users — who can read bronze$images (audit/sharing view)
    list_users:
      - object: table:bronze$images
        user_filter:
          - type: user
        relation: can_read_data
        users:
          - user:admin_amy      # catalog owner -> bronze -> table
          - user:svc_ingest     # ingestion role writer -> reader
          - user:dee            # data_engineer role reader on bronze
