{{- if and .Values.observability.enabled (not .Values.externalSecrets.enabled) }}
# GreptimeDB object-storage credentials — the greptimedb-standalone subchart reads these env-var keys
# from `credentials.existingSecretName`. Points GreptimeDB at the in-cluster RustFS S3 (same keys).
# Skipped when externalSecrets.enabled: the external-secrets operator then OWNS this same-named Secret,
# syncing the RustFS root secret FROM Vault (templates/external-secrets.yaml) — same two-tier rule as
# infra-credentials, so the "0 plaintext secrets on the prod-secure path" guarantee holds here too.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-observability-s3
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
stringData:
  GREPTIMEDB_STANDALONE__STORAGE__ACCESS_KEY_ID: {{ .Values.rustfs.accessKey | quote }}
  GREPTIMEDB_STANDALONE__STORAGE__SECRET_ACCESS_KEY: {{ .Values.rustfs.secretKey | quote }}
{{- end }}
---
{{- if and .Values.dapr.enabled (include "lance.otelEnabled" .) }}
# Dapr tracing Configuration — sidecars annotated with dapr.io/config: lance-tracing. There is NO otel
# exporter here (mirrors rask: the apps export OTLP to the OTel Collector, which forwards to GreptimeDB;
# Dapr's own sidecar spans can't
# carry GreptimeDB's required db-name/pipeline headers). samplingRate "1" keeps Dapr sampling every
# request so the W3C trace context always propagates across the pub/sub boundary — which is what makes
# the app-level distributed trace span catalog → (Dapr/NATS) → lineage end to end. Gated on otelEnabled,
# NOT observability.enabled: the app pods that reference this config also render when telemetry ships to an
# external collector (externalOtlpEndpoint), so a dangling dapr.io/config reference must not happen.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: lance-tracing
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  tracing:
    samplingRate: {{ .Values.observability.samplingRate | quote }}
{{- end }}
---
{{- if and .Values.observability.enabled .Values.observability.edgeAuth.enabled }}
# Edge basic-auth htpasswd for the gateway's public /perses/ + /greptime/ locations (§5e). Both are
# otherwise UNAUTHENTICATED (the Perses dashboard + GreptimeDB's raw SQL/ingest on :4000), and the prod
# Ingress→gateway proxies them publicly — this Secret backs the nginx `auth_basic_user_file` (gateway.yaml)
# that closes that hole. INFRA-TIER credential (the two-tier secret model, like infra-credentials.yaml):
# held ONLY in this k8s Secret and mounted read-only into the gateway pod as a file — never a plaintext pod
# env/arg value. In prod the operator populates `observability.edgeAuth.htpasswd` out-of-band from
# OpenBao/Vault (external-secrets), so no credential ships in values.yaml; `required` fails the render
# CLOSED when edgeAuth is enabled but the htpasswd line is unset.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-observability-edge-auth
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
stringData:
  htpasswd: {{ required "observability.edgeAuth.htpasswd must be set when observability.edgeAuth.enabled=true — supply an htpasswd line (user:apr1/bcrypt-hash) via --set / an external secret, e.g. `htpasswd -nbB observer <pw>`" .Values.observability.edgeAuth.htpasswd | quote }}
{{- end }}
