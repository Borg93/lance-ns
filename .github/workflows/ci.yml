name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Linux-only lockfile)
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: |
          uvx ruff check app tests
          uvx ruff format --check app tests

      - name: Type-check (ty)
        run: uvx ty check app

      # Integration tests (our logic only) + the moto-S3 end-to-end round-trip.
      # No external infra needed — moto runs an in-process S3 server.
      - name: Tests
        run: uv run --no-sync pytest tests/integration -q
