{{- if .Values.observability.enabled }}
# GreptimeDB object-storage credentials — the greptimedb-standalone subchart reads these env-var keys
# from `credentials.existingSecretName`. Points GreptimeDB at the in-cluster RustFS S3 (same keys).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-observability-s3
  labels: {{- include "lance.labels" . | nindent 4 }}
type: Opaque
stringData:
  GREPTIMEDB_STANDALONE__STORAGE__ACCESS_KEY_ID: {{ .Values.rustfs.accessKey | quote }}
  GREPTIMEDB_STANDALONE__STORAGE__SECRET_ACCESS_KEY: {{ .Values.rustfs.secretKey | quote }}
---
{{- if .Values.dapr.enabled }}
# Dapr tracing Configuration — sidecars annotated with dapr.io/config: lance-tracing. There is NO otel
# exporter here (mirrors rask: the apps export OTLP-direct to GreptimeDB; Dapr's own sidecar spans can't
# carry GreptimeDB's required db-name/pipeline headers). samplingRate "1" keeps Dapr sampling every
# request so the W3C trace context always propagates across the pub/sub boundary — which is what makes
# the app-level distributed trace span catalog → (Dapr/NATS) → lineage end to end.
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: lance-tracing
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  tracing:
    samplingRate: {{ .Values.observability.samplingRate | quote }}
{{- end }}
{{- end }}
