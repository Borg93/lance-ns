<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="data:," />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>lance-media annotator</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
			rel="stylesheet"
		/>
		<!--
      Dark-first (matches the shared design system). <html> ships with the
      `dark` class so first paint is dark with no flash; we only DROP it when
      the user has explicitly chosen light (theme-toggle persists the choice).
    -->
		<script>
			(function () {
				try {
					if (localStorage.getItem('lance-media-theme') === 'light') {
						document.documentElement.classList.remove('dark');
					}
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
