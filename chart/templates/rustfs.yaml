{{- if .Values.rustfs.enabled }}
# RustFS — the S3-compatible object store for the Lance lakehouse (the project's chosen store; mc
# bootstraps the bucket since it speaks plain S3).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.rustfsHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports:
    - { name: s3, port: {{ .Values.rustfs.port }}, targetPort: 9000 }
  selector:
    app.kubernetes.io/component: rustfs
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.rustfs.persistence.enabled }}
# Durable storage for the LAKEHOUSE (Lance data) + GreptimeDB's observability bucket — the months-living
# data asset. Without this RustFS is emptyDir and every pod roll wipes it. Backed by the cluster's default
# StorageClass (local-path on kind; a real CSI volume in prod, which is snapshot-able / backup-able).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "lance.rustfsHost" . }}-data
  labels: {{- include "lance.labels" . | nindent 4 }}
  # Survive `helm uninstall` — this is the lakehouse, not throwaway. Helm reclaims release-owned PVCs on
  # uninstall UNLESS kept (the AGE/NATS PVCs are StatefulSet-owned → retained by default; a directly
  # templated PVC like this one is not). A later reinstall with the same release name re-adopts it.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.rustfs.persistence.storageClassName }}
  storageClassName: {{ . | quote }} # prod: a snapshot-capable/encrypted CSI class (for the documented VolumeSnapshot backups)
  {{- end }}
  resources: { requests: { storage: {{ .Values.rustfs.storage }} } }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.rustfsHost" . }}
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.rustfs.persistence.enabled }}
  strategy: { type: Recreate } # RWO PVC: the old pod must release the volume before the new one mounts it
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: rustfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-rustfs
      {{- end }}
      {{- if .Values.security.infraContexts.enabled }}
      # Per-image uid/fsGroup from values (the audit: data/secret holders need runAsUser+fsGroup for
      # their PVCs — no blind helper reuse). Flag default OFF: flip after the kind boot check (§7a).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.infraContexts.rustfs.runAsUser }}
        {{- with .Values.security.infraContexts.rustfs.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image }}
          args: ["/data"] # RustFS takes the data path as the final command arg
          env:
            - { name: RUSTFS_ACCESS_KEY, value: {{ .Values.rustfs.accessKey | quote }} }
            # The S3 root secret from a k8s Secret (not a plaintext pod-spec value) — this is the most
            # sensitive credential (bucket root). Prod populates the Secret from OpenBao via the operator.
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: rustfs-secret-key }
            - { name: RUSTFS_ADDRESS, value: ":9000" }
            {{- if .Values.rustfs.oidc.enabled }}
            # OIDC identity provider (Dex) for STS AssumeRoleWithWebIdentity — a client presents its Dex
            # id_token and RustFS mints short-TTL creds bound to ROLE_POLICY, which the catalog's inline
            # session policy then scopes per-table (Track B / credential vending). MinIO-compatible config.
            - { name: RUSTFS_IDENTITY_OPENID_ENABLE, value: "on" }
            - { name: RUSTFS_IDENTITY_OPENID_CONFIG_URL, value: "{{ .Values.dex.issuer }}/.well-known/openid-configuration" }
            - { name: RUSTFS_IDENTITY_OPENID_CLIENT_ID, value: {{ .Values.dex.clientId | quote }} }
            - { name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET, value: {{ .Values.dex.clientSecret | quote }} }
            - { name: RUSTFS_IDENTITY_OPENID_SCOPES, value: "openid,email" }
            # The base policy every Dex-authenticated token assumes; the per-request session policy can only
            # narrow it. `readwrite` is a built-in policy (full S3); narrowing happens in the session policy.
            - { name: RUSTFS_IDENTITY_OPENID_ROLE_POLICY, value: {{ .Values.rustfs.oidc.rolePolicy | quote }} }
            {{- end }}
          ports:
            - { name: s3, containerPort: 9000 }
          {{- include "lance.tcpProbes" "s3" | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /data }
          resources: {{- include "lance.resources" (dict "root" . "comp" "rustfs") | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.rustfs.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "lance.rustfsHost" . }}-data }
          {{- else }}
          emptyDir: {} # ephemeral — throwaway CI only; the lakehouse wipes on every pod roll
          {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.rustfsHost" . }}-mkbucket
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    metadata:
      # The explicit component label is the P4 landmine (see bootstrap-admin.yaml): hook pods without one
      # are invisible to any component-scoped NetworkPolicy `from` list. Here it is LOAD-BEARING, not just
      # hygiene — rustfs:9000's ingress admits an enumerated client list ONLY (network-policy.yaml 3d,
      # which names rustfs-mkbucket), so an unlabeled pod's `mc alias set` loop waits forever under a
      # policy-enforcing CNI and every prod install/upgrade wedges before a bucket exists.
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs-mkbucket
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      containers:
        - name: mc
          image: {{ .Values.rustfs.mcImage }}
          # The S3 root secret from a k8s Secret (not interpolated plaintext into the shell command) —
          # `mc alias set` reads it from "$RUSTFS_SECRET_KEY", so it never appears in the rendered Job
          # command/args. Mirrors the RustFS server Deployment (the audit's sibling-Job leak fix).
          env:
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "lance.fullname" . }}-infra-credentials, key: rustfs-secret-key }
          command:
            - sh
            - -c
            - |
              until mc alias set rfs http://{{ include "lance.rustfsHost" . }}:{{ .Values.rustfs.port }} {{ .Values.rustfs.accessKey }} "$RUSTFS_SECRET_KEY"; do echo wait-rustfs; sleep 3; done
              mc mb --ignore-existing rfs/{{ .Values.rustfs.bucket }}
              {{- if .Values.observability.enabled }}
              mc mb --ignore-existing rfs/{{ .Values.observability.bucket }}  # GreptimeDB object store
              {{- end }}
              {{- range $ns, $bkt := .Values.medallion.buckets }}
              {{- if and $bkt (ne $bkt $.Values.rustfs.bucket) }}
              mc mb --ignore-existing rfs/{{ $bkt }}  # medallion storage zone ({{ $ns }}: ingest-source / gold-sink)
              {{- end }}
              {{- end }}
{{- end }}
