[project]
name = "lance-ns"
version = "0.1.0"
description = "Lance Namespace REST Catalog (FastAPI over native pylance DirectoryNamespace, MinIO)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pylance>=7.0.0",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "lance-namespace>=0.8.6",
    "lance-namespace-urllib3-client>=0.8.6",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "openfga-sdk>=0.9",
    "tenacity>=9.1.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "dapr>=1.18.1",
    "dapr-ext-fastapi>=1.18.1",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-psycopg>=0.64b0",
    "opentelemetry-instrumentation-logging>=0.64b0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "requests>=2.32",
    "ruff>=0.6",
    "moto[s3,server]>=5",
    "openlineage-python>=1.50.0",
]

# pylance 7.x caps lance-namespace<0.8 in its metadata, but at runtime it works
# with the latest lance-namespace 0.8.x — verified: native DirectoryNamespace +
# branch ops + create/list all function. We override that conservative cap so the
# catalog tracks the latest namespace spec (branches, managed versions). pylance
# ships no macOS x86_64 wheel, so resolution is restricted to Linux (devcontainer
# + Docker) for a clean, reproducible lockfile across teammates / CI / Codespaces.
[tool.uv]
environments = ["sys_platform == 'linux'"]
override-dependencies = [
    "lance-namespace>=0.8.6",
    "lance-namespace-urllib3-client>=0.8.6",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests against a running server (set LANCE_REST_E2E_URL)",
]

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
