{{- if .Values.gateway.enabled }}
{{- $port := .Values.gateway.port }}
# API gateway — a single nginx reverse proxy that path-routes to every in-cluster service, so one
# port-forward fronts the whole platform. Prefixes are stripped (trailing slash on proxy_pass), so e.g.
# GET /lineage/runs → lineage:8000/runs. In prod this Service sits behind a k8s Ingress (same routes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lance.fullname" . }}-gateway
  labels: {{- include "lance.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    # nginx-unprivileged runs as non-root → /run isn't writable. Pin the pid + temp paths to /tmp
    # (also keeps the image read-only-rootfs ready). Per the dockerfile skill's static-nginx note.
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      access_log /dev/stdout;
      error_log  /dev/stderr;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      server {
        listen {{ $port }};

        # No UI here: the MFE zones are served by the Ingress (web-<zone> Services) — the gateway is the
        # BACKEND-only edge. A root hit is a routing mistake, answered honestly. (The old `-web` upstream
        # made every fresh gateway boot crash with "host not found" once apps/web retired — nginx resolves
        # upstreams at startup, so the long-lived pod masked it until the first from-scratch install.)
        location / { return 404; }

        # App APIs are routed via Dapr SERVICE INVOCATION through the gateway's OWN sidecar (:3500):
        #   /lineage/runs → http://127.0.0.1:3500/v1.0/invoke/lineage/method/runs
        # so the gateway→service hop rides Dapr (mTLS + retries + distributed tracing), not a raw nginx
        # upstream. This is the "Dapr-native gateway": nginx is just the clean-URL north-south edge.
        location /catalog/  { proxy_pass http://127.0.0.1:3500/v1.0/invoke/{{ .Values.services.catalog.daprAppId }}/method/; }
        # Dapr-delivered routes (pub/sub ingest + the cron reconcile binding) are sidecar-only — never
        # expose them through the public edge (defense-in-depth on top of the app-api-token). The block
        # list is the lance.lineageSidecarOnlyRoutes helper (ONE source — add new Dapr routes there). A
        # REGEX prefix (case-insensitive) — not an exact-match — so trailing-slash (/lineage-events/),
        # sub-path, and ..-normalization variants can't fall through to the /lineage/ proxy. nginx
        # evaluates regex locations before prefixes.
        location ~* ^/lineage/({{ include "lance.lineageSidecarOnlyRoutes" . }}) { return 403; }
        location /lineage/  { proxy_pass http://127.0.0.1:3500/v1.0/invoke/{{ .Values.services.lineage.daprAppId }}/method/; }
        {{- if and .Values.medallion.enabled .Values.medallion.producer.expose }}
        # The dummy raw-writer demo entry point — carries NO auth (it sidesteps enforce_author), so it is
        # values-gated: producer.expose=true is the DEV demo; values-prod flips it off (an external caller
        # could otherwise trigger cascades + inject forged medallion provenance).
        location /produce   { proxy_pass http://127.0.0.1:3500/v1.0/invoke/{{ .Values.medallion.producer.daprAppId }}/method/produce; }
        {{- end }}
        {{- if .Values.observability.enabled }}
        {{- if .Values.observability.edgeAuth.enabled }}
        # §5e hardening — Perses (dashboard) AND GreptimeDB (RAW SQL/ingest on :4000) are BOTH
        # unauthenticated upstreams; in prod this gateway sits behind a public Ingress, so guard the edge
        # with basic-auth. htpasswd comes from the {{ include "lance.fullname" . }}-observability-edge-auth
        # Secret, mounted read-only below (an infra-tier credential — never a pod env/arg value). Gated on
        # observability.edgeAuth.enabled (default off → dev / `make dashboards` is unchanged, no auth).
        location /perses/   {
          auth_basic "{{ .Values.observability.edgeAuth.realm }}";
          auth_basic_user_file /etc/nginx/edge-auth/htpasswd;
          proxy_pass http://{{ include "lance.fullname" . }}-perses:8080/;
        }
        location /greptime/ {
          auth_basic "{{ .Values.observability.edgeAuth.realm }}";
          auth_basic_user_file /etc/nginx/edge-auth/htpasswd;
          proxy_pass http://{{ include "lance.greptimeHost" . }}:{{ .Values.observability.greptimePort }}/;
        }
        {{- else }}
        location /perses/   { proxy_pass http://{{ include "lance.fullname" . }}-perses:8080/; }
        location /greptime/ { proxy_pass http://{{ include "lance.greptimeHost" . }}:{{ .Values.observability.greptimePort }}/; }
        {{- end }}
        {{- end }}

        # Gateway's own liveness (doesn't depend on any upstream).
        location = /healthz { return 200 "ok\n"; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lance.fullname" . }}-gateway
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas | default 1 }}
  selector:
    matchLabels: { app.kubernetes.io/component: gateway, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        {{- include "lance.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      {{- if .Values.dapr.sidecars }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: {{ .Values.gateway.daprAppId | quote }}
        dapr.io/app-port: {{ $port | quote }}
        dapr.io/log-level: {{ .Values.dapr.logLevel | quote }}
        {{- include "lance.daprSidecarResources" . | nindent 8 }}
        {{- if .Values.observability.enabled }}
        dapr.io/config: "lance-tracing"
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.podDisruptionBudget.enabled }}
      {{- include "lance.spreadConstraints" "gateway" | nindent 6 }}
      {{- end }}
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-gateway
      {{- end }}
      {{- if .Values.security.infraContexts.enabled }}
      # Per-image uid/fsGroup from values (the audit: data/secret holders need runAsUser+fsGroup for
      # their PVCs — no blind helper reuse). Flag default OFF: flip after the kind boot check (§7a).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.infraContexts.gateway.runAsUser }}
        {{- with .Values.security.infraContexts.gateway.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        seccompProfile: { type: RuntimeDefault }
      {{- end }}
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports: [{ name: http, containerPort: {{ $port }} }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
            {{- if and .Values.observability.enabled .Values.observability.edgeAuth.enabled }}
            # §5e — the auth_basic htpasswd, mounted read-only (file-only, never a pod env/arg value).
            - { name: edge-auth, mountPath: /etc/nginx/edge-auth, readOnly: true }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          # LIVENESS + preStop (audit 2026-07-14: the gateway was the ONE first-party Deployment with
          # neither, while the docs claimed "every Deployment has probes + preStop" — a false "every").
          # Liveness is deliberately slower/more tolerant than readiness (the app-probe contract): a busy
          # but alive nginx must never be SIGKILLed by an impatient probe.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # preStop matters MOST here of anywhere: the gateway is the INGRESS. Without a drain delay a
          # rolling update tears nginx down the instant the pod is marked Terminating — while kube-proxy is
          # still routing to it — so in-flight requests are dropped. The sleep lets endpoints propagate first.
          {{- include "lance.preStop" . | nindent 10 }}
          resources: {{- toYaml .Values.resources.default | nindent 12 }}
      volumes:
        - name: conf
          configMap: { name: {{ include "lance.fullname" . }}-gateway }
        {{- if and .Values.observability.enabled .Values.observability.edgeAuth.enabled }}
        # §5e — the observability edge-auth htpasswd Secret (templates/observability.yaml), projected as a
        # single file for nginx's auth_basic_user_file. Infra-tier: the credential lives only in the Secret.
        - name: edge-auth
          secret:
            secretName: {{ include "lance.fullname" . }}-observability-edge-auth
            items: [{ key: htpasswd, path: htpasswd }]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lance.fullname" . }}-gateway
  labels: {{- include "lance.labels" . | nindent 4 }}
spec:
  ports: [{ name: http, port: {{ $port }}, targetPort: http }]
  selector: { app.kubernetes.io/component: gateway, app.kubernetes.io/instance: {{ .Release.Name }} }
{{- end }}
