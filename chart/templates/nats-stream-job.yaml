{{- if .Values.nats.enabled }}
# Create the JetStream LINEAGE stream (subjects lineage.events.>) that the Dapr pubsub.jetstream
# component publishes to / consumes from. Dapr's jetstream component does NOT auto-create the stream,
# so this post-install Job does it (idempotent: skip if it already exists).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-nats-stream
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: nats
          image: natsio/nats-box:0.14.5
          command:
            - sh
            - -c
            - |
              S="nats://{{ include "lance.natsHost" . }}:4222"
              until nats --server "$S" stream ls >/dev/null 2>&1; do echo wait-nats; sleep 3; done
              if nats --server "$S" stream info LINEAGE >/dev/null 2>&1; then
                echo "stream LINEAGE already exists"
              else
                nats --server "$S" stream add LINEAGE \
                  --subjects "lineage.events.>" --storage file --retention limits \
                  --max-age=168h --max-bytes=-1 --max-msgs=-1 --max-msgs-per-subject=-1 \
                  --max-msg-size=-1 --discard old --dupe-window=2m --replicas 1 \
                  --no-allow-rollup --deny-delete --deny-purge
              fi
{{- end }}
