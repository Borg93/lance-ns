{{- if or .Values.nats.enabled .Values.nats.externalUrl }}
# Create the JetStream LINEAGE stream (subjects lineage.events.>) that the Dapr pubsub.jetstream
# component publishes to / consumes from. Dapr's jetstream component does NOT auto-create the stream,
# so this post-install Job does it (idempotent: skip if it already exists). Also runs against an
# EXTERNAL NATS (nats.externalUrl + nats.enabled=false) — the component would otherwise point at a
# server with no streams and every publish would fail.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lance.fullname" . }}-nats-stream
  labels: {{- include "lance.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      {{- if .Values.security.serviceAccounts.enabled }}
      serviceAccountName: {{ include "lance.fullname" . }}-sa-jobs
      {{- end }}
      containers:
        - name: nats
          image: natsio/nats-box:0.14.5
          command:
            - sh
            - -c
            - |
              S="{{ include "lance.natsUrl" . }}"
              until nats --server "$S" stream ls >/dev/null 2>&1; do echo wait-nats; sleep 3; done
              # LINEAGE carries OpenLineage events; MEDALLION carries the stage triggers that cascade the
              # event-driven pipeline (medallion.raw/bronze/silver); TRAINING carries the train triggers
              # (training.jobs — docs/RAY-TRAIN.md D1: its OWN stream, so the durable consumer names stay
              # per-stream and a slow train path never shares limits with the stage cascade). Each created
              # once (idempotent skip).
              # streamReplicas > 1 (raft-replicated streams) needs a CLUSTERED NATS — the in-cluster
              # single-node subchart supports 1 only; set 3 with an external/clustered NATS in prod.
              add_if_missing() {
                if nats --server "$S" stream info "$1" >/dev/null 2>&1; then
                  echo "stream $1 already exists"
                else
                  nats --server "$S" stream add "$1" \
                    --subjects "$2" --storage file --retention limits \
                    --max-age=168h --max-bytes=-1 --max-msgs=-1 --max-msgs-per-subject=-1 \
                    --max-msg-size=-1 --discard old --dupe-window=2m --replicas {{ .Values.nats.streamReplicas | default 1 }} \
                    --no-allow-rollup --deny-delete --deny-purge
                fi
              }
              add_if_missing LINEAGE "lineage.events.>"
              add_if_missing MEDALLION "medallion.>"
              add_if_missing TRAINING "training.>"
              # DLQ parks dead-lettered deliveries (dapr.resiliency — the sidecar publishes to dlq.*
              # after retry exhaustion). Its OWN stream for two load-bearing reasons: Dapr does NOT
              # auto-create streams (a parking publish with no stream FAILS, silently un-parking the
              # message), and NATS scopes consumer names PER STREAM — the dlq.* subscriptions reuse
              # each app's durableName, which only avoids clashing with the app's main consumer
              # because the two live on different streams.
              add_if_missing DLQ "dlq.>"
{{- end }}
