name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Linux-only lockfile)
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: |
          uvx ruff check services tests
          uvx ruff format --check services tests

      - name: Type-check (ty)
        run: uvx ty check

      # Unit + integration tests (our logic only) + the moto-S3 round-trip.
      # No external infra needed — moto runs an in-process S3 server, and the
      # auth/authz tests fake the OIDC verifier + fga.check. The `e2e` marker is
      # excluded here; the live stack runs in the `auth-e2e` job below.
      # `tests/unit` is included when present (guarded so CI is green before the
      # write-side unit suite lands).
      - name: Tests (unit + integration)
        run: |
          paths="tests/integration"
          [ -d tests/unit ] && paths="tests/unit $paths"
          uv run --no-sync pytest $paths -q -m "not e2e"

      # The Helm chart is a first-class deliverable (the whole stack deploys from it), so lint + a full
      # template render gate on every push — a broken template or values reference fails here, not at deploy.
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint + render
        run: |
          helm lint chart
          helm template chart >/dev/null

      # Render-and-grep the OPT-IN network-isolation layer (Batch 9): default values must render
      # ZERO NetworkPolicies beyond nothing (flag off), and the flag ON must produce the audit's
      # invariants — a default-deny covering Ingress+Egress, the kube-dns egress allow IN THE SAME
      # RENDER (the audit's named footgun: default-deny egress without it bricks DNS), and the
      # exclusive openbao client list (the headline gap: openbao was reachable by any pod).
      - name: Helm render network-policy layer (flag on) + invariants
        run: |
          set -euo pipefail
          off=$(helm template chart --set networkPolicy.enabled=false | grep -c "kind: NetworkPolicy" || true)
          [ "$off" = "0" ] || { echo "flag OFF must render zero NetworkPolicies, got $off"; exit 1; }
          helm template chart --set networkPolicy.enabled=true > /tmp/np.yaml
          count=$(grep -c "kind: NetworkPolicy" /tmp/np.yaml)
          [ "$count" -ge 9 ] || { echo "expected >=9 NetworkPolicies, got $count"; exit 1; }
          grep -q "default-deny" /tmp/np.yaml
          grep -q "allow-dns" /tmp/np.yaml
          grep -q "k8s-app: kube-dns" /tmp/np.yaml
          grep -q -- "-openbao" /tmp/np.yaml
          # the general intra-namespace ingress allow must EXCLUDE the guarded stores
          grep -q "NotIn" /tmp/np.yaml

      # Render-and-grep the SA + infra-context layer (Batch 10, same opt-in discipline):
      # flags OFF → zero of our SAs, zero serviceAccountName lines, zero infra runAsUser blocks;
      # flags ON → every first-party workload gets its dedicated unbound SA (automount false ON
      # THE SA object) and the infra pods + wait-age init containers carry their contexts.
      - name: Helm render security hardening (flags on) + invariants
        run: |
          set -euo pipefail
          off=$(helm template chart | grep -c -- "-sa-" || true)
          [ "$off" = "0" ] || { echo "flags OFF must render zero of our SAs, got $off"; exit 1; }
          helm template chart \
            --set security.serviceAccounts.enabled=true \
            --set security.infraContexts.enabled=true > /tmp/sec.yaml
          sa_objects=$(grep -c "kind: ServiceAccount" /tmp/sec.yaml || true)
          [ "$sa_objects" -ge 16 ] || { echo "expected >=16 SA objects (12 fixed + 4 movers), got $sa_objects"; exit 1; }
          automount_off=$(grep -c "automountServiceAccountToken: false" /tmp/sec.yaml || true)
          [ "$automount_off" -ge 16 ] || { echo "every OUR SA must set automount false, got $automount_off"; exit 1; }
          wired=$(grep -c "serviceAccountName: .*-sa-" /tmp/sec.yaml || true)
          # >=12: some workloads are toggle-gated in default values (dex behind auth, backups off)
          [ "$wired" -ge 12 ] || { echo "expected >=12 pods wired to dedicated SAs, got $wired"; exit 1; }
          grep -q "runAsUser: 999" /tmp/sec.yaml   # age-postgres context rendered
          grep -q "runAsUser: 65532" /tmp/sec.yaml # wait-age init hardening rendered (PSA prereq)

      # Render-and-grep the OPT-IN Dapr resiliency + dead-letter layer (Batch 18, same discipline):
      # flag OFF must render byte-identical pre-existing pubsub semantics (no Resiliency CRD, no DLQ
      # envs, the chaos-verified 30-300s broker backOff); flag ON must ship the SET together — the
      # Resiliency CRD (sidecar-owned retries), the *_DLQ_TOPIC envs (deadLetterTopic subscriptions),
      # and the crash-recovery broker backOff (720s first step > the sidecar's total retry span).
      # A deadLetterTopic WITHOUT the retry policy dead-letters on the FIRST failure (Dapr default) —
      # this gate makes shipping one without the others impossible.
      - name: Helm render dapr resiliency + DLQ layer (flag on) + invariants
        run: |
          set -euo pipefail
          off=$(helm template chart | grep -c "kind: Resiliency" || true)
          [ "$off" = "0" ] || { echo "flag OFF must render zero Resiliency CRDs, got $off"; exit 1; }
          offdlq=$(helm template chart | grep -c "DLQ_TOPIC" || true)
          [ "$offdlq" = "0" ] || { echo "flag OFF must render zero DLQ envs, got $offdlq"; exit 1; }
          helm template chart | grep -q '30s,60s,120s,300s'   # chaos-verified schedule intact
          helm template chart --set dapr.resiliency.enabled=true > /tmp/resil.yaml
          grep -q "kind: Resiliency" /tmp/resil.yaml
          grep -q "pubsubDeliveryRetry" /tmp/resil.yaml
          dlq=$(grep -c "DLQ_TOPIC" /tmp/resil.yaml || true)
          [ "$dlq" -ge 3 ] || { echo "expected >=3 DLQ envs (lineage+producer+movers), got $dlq"; exit 1; }
          grep -q "720s,720s" /tmp/resil.yaml               # broker demoted to crash recovery
          ! grep -q "30s,60s,120s,300s" /tmp/resil.yaml     # never BOTH retry owners at once

      # The OpenFGA authorization model is source-of-truth for who-can — gate its tests (7 types,
      # concentric rungs, the validator promote gate, create-on-parent) so a model edit can't regress access.
      - name: OpenFGA model test
        run: |
          FGA_V=0.6.4
          curl -fsSL "https://github.com/openfga/cli/releases/download/v${FGA_V}/fga_${FGA_V}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin fga
          fga model test --tests services/common/auth/model.fga.yaml

  # Frontend suites (§7 "not in CI" gap, closed 2026-07-11): svelte-check (types over the runes
  # store + generated OpenAPI types), the bun unit tests, and the Playwright e2e — which was BUILT
  # hermetic for CI (playwright.config.ts mocks every /api/** via page.route; the webServer is the
  # real SSR dev server, so hydration + routing are exercised with zero backend).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Turborepo workspace (Batch 12): check + unit tests fan out over apps/* AND packages/*
      # (the @lance/ui exports/transport-agnosticism tests run here too).
      - name: svelte-check + unit tests (turbo)
        run: bunx turbo run check test

      - name: Install Playwright chromium
        working-directory: frontend/apps/web
        run: bunx playwright install --with-deps chromium

      - name: Playwright e2e (hermetic — /api mocked in-page)
        run: bunx turbo run test:e2e --filter=lance-lineage-web

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/apps/web/test-results/
          retention-days: 7

  # AGE-backed lineage e2e (§7): the graph repository's REAL Cypher runs against a real Apache AGE
  # Postgres — the unit fakes can't catch AGE dialect behavior (the int-vs-string $ver at-version
  # match, the RETURN-less DETACH DELETE prune, the functional-index DDL). Runs via the Dagger module
  # (AGE as a hermetic service container) so `make e2e-lineage` == `dagger call test-lineage` == this
  # job, byte-for-byte. Engine version pinned by dagger.json. Same fork-gating as auth-e2e.
  lineage-e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI (pinned to the module's engineVersion)
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.20.3 BIN_DIR=/usr/local/bin sh

      - name: Lineage e2e (real AGE graph, hermetic via Dagger)
        env:
          DAGGER_NO_NAG: "1"
        run: dagger call test-lineage

  # Gated live auth end-to-end: brings up the SQLite OpenFGA + Dex stack via
  # docker compose and runs scripts/auth_e2e.sh, which asserts APP-SIDE SEEDING
  # (create namespace/table -> owner + parent cascade) and a 403 for a second
  # user with no grant. GitHub-hosted ubuntu runners ship Docker + Compose v2,
  # so this is feasible in CI. Skipped on forked-PR runs (no infra guarantees /
  # to avoid untrusted-code docker builds) but always runs on branch pushes.
  auth-e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (Linux-only lockfile)
        run: uv sync --frozen --all-groups

      - name: Show docker / compose versions
        run: |
          docker version
          docker compose version

      # Builds the server image, starts MinIO + SQLite OpenFGA + Dex, and runs
      # the full app-side-seeding assertion chain. The script tears the stack
      # down on exit (trap). A non-zero exit fails the job.
      # KEEP_STACK=1 leaves the stack up so the next step can collect logs on
      # failure; the always() cleanup below tears it down regardless of outcome.
      - name: Auth e2e (Dex + SQLite OpenFGA, app-side seeding)
        env:
          KEEP_STACK: "1"
        run: bash scripts/auth_e2e.sh

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose -f .docker/docker-compose.yml \
                         -f .docker/docker-compose.auth.sqlite.yml logs --no-color || true

      - name: Tear down stack
        if: always()
        run: |
          docker compose -f .docker/docker-compose.yml \
                         -f .docker/docker-compose.auth.sqlite.yml down -v || true
