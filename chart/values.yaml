# lance-ns umbrella chart values. Infra toggles gate both the subchart/template and its wiring, so a
# prod install with external infra flips one switch. Defaults target a local kind cluster.

# --- App images (the catalog + lineage share one image, different uvicorn entrypoint). Per-image
# repository/tag so Tilt can inject each built image independently (image_keys). ------------------
image:
  catalog: { repository: lance-rest-catalog, tag: dev } # catalog (catalog.main:app) + lineage (lineage.main:app)
  web: { repository: lance-lineage-web, tag: dev }
  pullPolicy: IfNotPresent

# --- Governance (Dex OIDC + OpenFGA). Off → open dev mode; on → the full governed demo. ------------
auth:
  enabled: false
  # Lock root (top-level) namespace/table creation to warehouse-create-grant holders. Off in dev
  # (open self-serve); values-prod sets it true so a token alone can't squat root namespaces.
  lockRootCreate: false
  # #41 compliance audit trail: structured who/what/outcome events for authn (success+failure), authz
  # (allow+deny), and credential vending on the dedicated `lance.audit` logger → OTLP → GreptimeDB. Rendered
  # into LANCE_AUDIT_ENABLED only when auth is on (that is where a real subject exists); set false to silence
  # the stream even with auth on.
  audit: true

# --- Data-plane credential vending (Track B). How a client gets storage_options for DIRECT object I/O. ----
# POST /v1/table/<id>/credentials?tier=read|write returns scoped creds (or mode=server_mediated). Modes:
#   mode_b        (default) — nothing vended; clients use the server-mediated Arrow-IPC data endpoints.
#   web_identity  — the RUSTFS-NATIVE path: the caller's Dex id_token is exchanged via
#                   AssumeRoleWithWebIdentity for creds bound to ROLE_POLICY, narrowed per-table by an inline
#                   session policy. Requires rustfs.oidc.enabled + auth.enabled (the caller presents a token).
#   sts           — plain AssumeRole + session policy. Works on a compliant STS (AWS / MinIO / Ceph / moto);
#                   NOT on RustFS (its STS rejects plain AssumeRole — that's why web_identity exists).
#   static        — pre-provisioned per-bucket keys.
vending:
  mode: mode_b # mode_b | web_identity | sts | static
  ttlSeconds: 900
  assumeRoleArn: "arn:aws:iam::000000000000:role/lance-vend" # RustFS ignores it; boto3 requires the param
  # Allow blob-v2 columns to reference EXTERNAL objects outside the dataset root (Blob.from_uri) on create.
  # Off by default: (1) external bytes live outside the lakehouse (Lance's GC can't protect them, a source
  # delete dangles the pointer); (2) SSRF — a client-controlled pointer URI is fetched server-side by the
  # cascade's read_blobs, so an arbitrary URI (cloud metadata / internal host) becomes a read primitive.
  # Enable only for a trusted producer. Managed/inline blobs (bytes copied in) always work regardless.
  allowExternalBlobs: false
  # The SAFER alternative to the blanket flag: a comma-separated allowlist of approved external base URIs
  # (e.g. "s3://media-bucket/approved,s3://other/base"). External Blob.from_uri pointers are accepted ONLY
  # under a registered base, with the blanket bypass left off — a curated media source without the SSRF door.
  # Empty = the chart defaults it to the release's own model-artifact base (s3://<rustfs.bucket>/models/,
  # the #92 allowlist for #115 registry pointers — plain-path artifacts in the lake's own bucket, no SSRF
  # surface). Overriding REPLACES that default — include the models base yourself or the train registry's
  # external pointers get rejected.
  externalBlobBases: ""

# --- Catalog request limits -----------------------------------------------------------------------
catalog:
  # Max request-body bytes accepted on any catalog route. The Arrow-IPC write endpoints buffer the whole
  # body in memory, so an unbounded POST (e.g. a multi-GB media blob pushed through the catalog instead of
  # the direct storage/vending path) OOMs the worker. The body-limit middleware rejects oversized bodies
  # with 413 before buffering. 256 MiB — generous for tabular batches + small inline blobs, bounded well
  # under a worker's memory. Big media must use the direct-write/vending path (claim-check), not this API.
  maxBodyBytes: 268435456 # 256 * 1024 * 1024
  # Cap on concurrent in-flight Arrow-IPC writes (create/insert/merge_insert) — each buffers up to
  # maxBodyBytes, so peak buffer memory = maxConcurrentWrites × maxBodyBytes. Over the cap → 429 +
  # Retry-After, shed before a body byte is buffered. 16 matches the code default (generous for the kind
  # demo, where a real burst never materializes); prod lowers it to fit the catalog memory tier —
  # values-prod.yaml states the sizing formula. 0 disables shedding.
  maxConcurrentWrites: 16
  # #3-A per-warehouse physical multi-tenancy (admin control plane). On → POST /v1/warehouses provisions a
  # physically separate bucket per warehouse (Lakekeeper parity) and binds top-level namespaces to it, so a
  # table under a bound namespace lands in that warehouse's bucket. Additive + backward-compatible: an
  # unbound namespace always routes to the shared rustfs.bucket, so single-tenant flows are untouched.
  warehouses:
    enabled: true
  # #3-B Lance multi-base DATA distribution: the ALLOWLIST of bucket URIs a single table's fragments may be
  # spread across (?data_base=s3://... per create, round-robin write, fan-out read — the Uber pattern). A
  # per-request base MUST be on this list (a caller can never target an arbitrary bucket). Empty = feature
  # off (single-location creates, byte-identical to before). Populate with pre-provisioned data buckets.
  multibase:
    dataBases: []

# --- Graceful rollouts -----------------------------------------------------------------------------
# preStop sleep: endpoint removal must propagate to kube-proxy/the Dapr sidecar BEFORE the app receives
# SIGTERM, else every rollout connection-refuses in-flight requests (and the apps' /readyz shutting_down
# branch is dead code). terminationGracePeriodSeconds bounds preStop + the app's own drain; compaction
# gets a longer budget so an in-flight sweep/Lance write is never SIGKILLed mid-transaction.
lifecycle:
  preStopSeconds: 5
  terminationGracePeriodSeconds: 30
  compactionTerminationGracePeriodSeconds: 120

# --- Pod hardening (applied to every app container via the lance.securityContext helper) ----------
# runAsNonRoot + drop-ALL-caps + RuntimeDefault seccomp are unconditional (the restricted PodSecurity
# baseline). readOnlyRootFilesystem is the one tunable: on by default (each app has a writable /tmp
# emptyDir for pyarrow/Lance spill + OTel), flip off only if a workload genuinely needs a writable rootfs.
security:
  readOnlyRootFilesystem: true
  # Batch 10 (2026-07-11) — both default OFF (behavior-identical); flip after the §7a live checks.
  # Dedicated unbound SA per first-party workload, automountServiceAccountToken:false ON THE SA
  # object (never the pod — the Dapr injector's projected token stays untouched). Pre-flip check:
  # `dapr mtls -k` must still verify after enabling (the audit's guidance).
  serviceAccounts:
    enabled: false
  # securityContexts for the INFRA pods (app tier is already hardened via lance.securityContext)
  # + PSA-restricted compliance for the root busybox wait-age init containers (the audit's
  # sequencing footgun: label the namespace `pod-security.kubernetes.io/enforce=restricted` ONLY
  # after these boot green — the label itself is a kubectl step, the namespace isn't chart-owned).
  # Per-image uid/fsGroup (data/secret holders need the RIGHT ids for their PVCs, not helper reuse):
  infraContexts:
    enabled: false
    rustfs: { runAsUser: 10001, fsGroup: 10001 } # MUST match the rustfs image's built-in `rustfs` user
    # (uid 10001) — it is what owns the on-disk data. A mismatched uid (this was 1000) does NOT CrashLoop:
    # RustFS starts and READS fine (world-readable dirs), but EVERY WRITE fails `Io error: Permission
    # denied (os error 13)` → S3 500/AccessDenied to every client. Live 2026-07-13: the whole data plane
    # was write-dead under infraContexts until this was corrected. fsGroup alone can't rescue it (the
    # dirs are mode 755 owned by group 10001, so a different group has no write bit).
    age: { runAsUser: 999, fsGroup: 999 } # postgres official image uid/gid
    openbao: { runAsUser: 100, fsGroup: 1000 } # hashicorp vault-family image uid
    dex: { runAsUser: 1001, fsGroup: 1001 }
    gateway: { runAsUser: 101 } # nginx worker uid; its conf already pins pid/temp to /tmp

# --- Network isolation (opt-in; requires a policy-enforcing CNI e.g. Calico/Cilium) ---------------
# kind's default CNI does NOT enforce NetworkPolicy, so this is a no-op there — it is prod hardening.
# Network-isolation layer (Batch 9 2026-07-11 — was: only the lance-ray ingress restriction).
# When enabled: namespace default-deny Ingress+Egress, kube-dns egress allow (same change — the
# audit's footgun), intra-namespace allows, api-server egress, and EXCLUSIVE client lists for the
# guarded stores (openbao ← secret-consuming app pods ONLY; age-postgres ← its real clients;
# rustfs ← the data plane + GreptimeDB). Default OFF (kind's default CNI ignores NetworkPolicy
# anyway); flip in values-prod on a policy-enforcing CNI — live runbook in todo_fable §7a.
networkPolicy:
  enabled: false
  # Extra `from` peers for the openbao policy — e.g. the external-secrets operator's namespace when
  # externalSecrets.enabled: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: external-secrets}}}]
  openbaoExtraFrom: []
  # Extra `from` peers for the rustfs policy — the ray-lance demo pods live outside the release's
  # component labels (deploy/ray-lance-demo.yaml), so grant them here when running `make ray-demo`:
  rustfsExtraFrom:
    - podSelector:
        matchLabels: { app: ray-lance-head }
    - podSelector:
        matchLabels: { app: ray-lance-worker }
  # Extra egress rules (verbatim NetworkPolicy egress entries) for externalized backends —
  # off-cluster S3, a managed NATS (nats.externalUrl), an external OTLP endpoint.
  extraEgress: []

# --- Dapr control plane (subchart) — injects the daprd sidecar into annotated pods ----------------
dapr:
  enabled: true
  sidecars: true # add dapr.io/* annotations to catalog + lineage
  logLevel: info
  # PodSecurity `restricted` compliance for the injected daprd sidecar. OFF by default (prod posture, like
  # networkPolicy.enabled). Our app containers are already `restricted`-clean (lance.securityContext:
  # runAsNonRoot + drop:[ALL] + RuntimeDefault); the sidecar is the remaining gap. Turning this on adds the
  # RuntimeDefault seccomp annotation; you MUST ALSO set the injector-wide drop-caps value it can't reach:
  #   --set dapr.sidecarRestricted=true --set dapr.dapr_sidecar_injector.sidecarDropALLCapabilities=true
  # NOTE full-namespace `restricted` ENFORCE is still blocked on THIS stack by the OTel Collector (a single
  # Deployment whose filelog receiver needs hostPath /var/log/pods — `restricted` forbids it, no value fixes
  # it): give the Collector its own namespace at `baseline`, or a ServiceAccount PSA exemption in the
  # API-server admission config. See
  # docs/KIND-RUNBOOK §6.4 — full enforce is parked-by-design (never applied on kind), same as L3.
  sidecarRestricted: false
  # Bound every DaprClient gRPC call (publish_event has no per-call timeout arg, and the SDK's default
  # deadline is unset) so a wedged sidecar can't hang a publisher indefinitely — a timeout surfaces as a
  # publish failure the caller handles (the producer → 503, the movers → RETRY) instead of a stuck request.
  apiTimeoutSeconds: 30
  # Dapr app-API-token — Dapr injects it (APP_API_TOKEN) into subscriber apps AND stamps a
  # `dapr-api-token` header on every event it DELIVERS, so the sidecar-delivered routes (/lineage-events,
  # /medallion-event, the cron route) reject any forged request that didn't come through the sidecar.
  # OVERRIDE in prod (it's the auth secret for those routes). Closes the provenance-forgery prod-blocker.
  appToken: "lance-dev-dapr-app-token-override-me"
  # Dapr-native retry + dead-letter layer (docs/RESILIENCE.md gap #2) — DEFAULT ON (Dapr-first rule,
  # 2026-07-12). Wires THREE things TOGETHER (they are only correct as a set — a deadLetterTopic
  # without a retry policy dead-letters on the FIRST failure per Dapr's documented default):
  #   1. a Resiliency CRD: the SIDECAR owns delivery retries (exponential 30s→300s, 5 attempts ≈ the
  #      previous broker schedule), scoped to the subscriber apps;
  #   2. deadLetterTopic on every subscription (via the *_DLQ_TOPIC envs): retry exhaustion PARKS the
  #      message on a per-app dlq.* topic (the DLQ stream, nats-stream-job) — ERROR-logged by the
  #      app's /dlq-event route — instead of silently ceasing to redeliver;
  #   3. the broker backOff moves to a long crash-recovery window (first step > the sidecar's total
  #      retry span) so broker redelivery no longer races the sidecar's in-flight retries — it now
  #      covers ONLY sidecar/pod death mid-delivery.
  # The once-open durable-consumer question is ANSWERED FROM SOURCE (components-contrib jetstream.go:
  # durableName is applied as-is per subscription, and NATS scopes consumer names PER STREAM — the
  # dlq.* topics live on their own DLQ stream, and the producer already runs two same-durable
  # subscriptions across two streams live). Remaining live check = the runbook 6.5 poison-inject.
  # Set false to restore the exact pre-2026-07-12 broker-only behavior (30-300s backOff, no DLQ).
  resiliency:
    enabled: true
  # The Dapr dashboard — a web UI for the Dapr stuff (components, subscriptions, configurations,
  # control plane). These are first-party keys (the dapr subchart ignores them).
  dashboard:
    enabled: true
    image: daprio/dashboard:0.15.0
  # daprd sidecar resources (first-party keys → the lance.daprSidecarResources annotations). The app
  # containers are bounded (resources.default); an unbounded daprd on all 8 sidecar'd pods is not.
  sidecarResources:
    cpuRequest: 50m
    cpuLimit: 300m
    memoryRequest: 64Mi
    memoryLimit: 256Mi
  global:
    ha:
      enabled: false # single-node kind
    mtls:
      # Pin Dapr Sentry service-to-service mTLS ON explicitly. It IS the subchart default, but pinning it
      # makes the relied-upon guarantee self-documenting and guards against an accidental `--set …=false`
      # or a subchart-default flip silently dropping inter-service encryption. Delegated to Dapr — we
      # hand-roll no TLS. Confirm live with `dapr mtls -k` (sidecars 2/2 with SPIFFE identities).
      enabled: true
    # NOTE: we use pub/sub + bindings + secret stores + service invocation only (no actors/workflows/jobs),
    # so placement + scheduler are logically unused — BUT do NOT disable them: daprd 1.18 connects to BOTH
    # at startup unconditionally and never becomes Ready without them (verified live — sidecars stuck 1/2
    # with "no such host: dapr-placement-server / dapr-scheduler-server-a"). The audit's "disable the unused
    # control plane" is a real footgun on Dapr 1.18; the control plane stays. (Shrinking scheduler replicas
    # 3→1 for single-node kind is the safe saving, if any.)

# --- NATS (subchart) — JetStream backs the Dapr pubsub.jetstream component -------------------------
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 1Gi
  # the headless service is <release>-nats:4222
  # First-party keys (the nats subchart ignores them):
  # Externalize: when set, the pubsub components + the stream-provision Job connect HERE instead of the
  # in-cluster NATS — pair with nats.enabled=false to use a managed/clustered NATS (the in-cluster
  # single node is a prod SPOF: the bus down = no lineage ingest, no cascade).
  externalUrl: "" # e.g. nats://nats.internal:4222
  # Raft replication for the LINEAGE/MEDALLION streams — REQUIRES a clustered NATS (3+ nodes); the
  # in-cluster single-node subchart only supports 1. Set 3 together with externalUrl in prod.
  streamReplicas: 1

# --- OpenFGA (subchart) — Zanzibar authz; datastore = the AGE Postgres (it's just postgres) --------
openfga:
  enabled: true
  replicaCount: 1
  # Pin to v1.8.0: v1.18.0's migration 006 (DROP INDEX CONCURRENTLY) breaks against the AGE-shared
  # Postgres; v1.8.0 migrates cleanly. Server + our migrate Job both use this tag (schema match).
  image:
    tag: v1.8.0
  datastore:
    engine: postgres
    # DSN comes from the infra-credentials Secret (key openfga-datastore-uri) — the SAME secret the AGE
    # servers + our migrate Job consume, rendered from age.* in dev and OWNED by the external-secrets
    # operator when externalSecrets.enabled. No plaintext password in values/env: the subchart's
    # existingSecret+secretKeys branch turns this into a secretKeyRef. (Subchart values can't template,
    # so the release-prefixed secret name is hardcoded like the lance-ns-age host was — Makefile RELEASE.)
    existingSecret: lance-ns-infra-credentials
    secretKeys:
      uriKey: openfga-datastore-uri
    # The chart's bundled migrate (both job + initContainer types) fails to pass the datastore flags in
    # 0.3.9, so we disable it and run our own proven migrate Job (templates/openfga-migrate.yaml) that
    # waits for the AGE Postgres first. The server then connects to the already-migrated db.
    applyMigrations: false
    waitForMigrations: false

# --- Apache AGE Postgres (first-party template) — the lineage graph store AND openfga's datastore --
age:
  enabled: true
  image: apache/age:release_PG16_1.5.0
  user: lance
  password: lance
  lineageDb: lineage
  openfgaDb: openfga
  port: 5432
  # Externalize: when set, lineage + the OpenFGA datastore connect to THIS host instead of the in-cluster
  # AGE — pair with age.enabled=false + a managed Postgres (set user/password/dbs to match). NOTE: the
  # openfga subchart's `openfga.datastore.uri` must also be overridden to the external DSN.
  externalHost: "" # e.g. my-pg.rds.amazonaws.com
  # Effectively immutable after first install: StatefulSet volumeClaimTemplates can't be updated in
  # place, so the chart fails the upgrade if this differs from the deployed StatefulSet instead of
  # silently not resizing. To resize: patch the PVC, recreate the StatefulSet with --cascade=orphan,
  # then upgrade — see docs/RUNBOOK-restore.md.
  storage: 1Gi

# --- Dex (first-party template) — OIDC issuer for the governed demo --------------------------------
dex:
  enabled: true
  image: ghcr.io/dexidp/dex:v2.42.0
  port: 5556
  issuer: http://lance-ns-dex:5556/dex # in-cluster issuer (matches the OIDC config)
  # A static client + a static password (demo only).
  clientId: lance-catalog
  clientSecret: lance-catalog-secret
  staticUser: alice@example.com
  # NOTE: the demo password is NOT set here — Dex needs a bcrypt HASH, which Helm can't compute at render.
  # It's hardcoded in templates/dex.yaml (staticPasswords[].hash = bcrypt of "password"). To change it,
  # regenerate the hash (e.g. `htpasswd -bnBC 10 "" <pw> | tr -d ':\n'`) and edit that template.

# --- RustFS (first-party template) — S3 for the Lance lakehouse (the project's chosen store) --------
rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.0-beta.8 # pinned (multi-arch amd64+arm64); rustfs is pre-1.0 so this is the current release
  accessKey: rustfsadmin
  secretKey: rustfsadmin
  bucket: lance-catalog
  port: 9000
  # Externalize: when set, the apps (catalog/lineage/compaction + vending STS) connect HERE instead of the
  # in-cluster RustFS — pair with rustfs.enabled=false to use a managed S3. NOTE: the greptimedb-standalone
  # subchart's S3 endpoint (under `greptimedb-standalone.objectStorage.s3.endpoint`) must be overridden too.
  externalEndpoint: "" # e.g. https://s3.us-east-1.amazonaws.com
  storage: 2Gi
  # Durable lakehouse storage. Default true → a PVC (the lakehouse + GreptimeDB data survive a pod roll +
  # are snapshot-able in prod). false → emptyDir, for throwaway CI only (wipes on every roll).
  persistence:
    enabled: true
    storageClassName: "" # "" = the cluster default SC (local-path on kind); prod: a snapshot-capable CSI class
  mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z # pinned (multi-arch); `mc` speaks plain S3 → bootstraps the bucket on RustFS too
  # OIDC identity provider for STS AssumeRoleWithWebIdentity (Track B). When on, RustFS trusts Dex id_tokens
  # → a client can mint short-TTL creds it scopes per-table via the catalog's vending endpoint (vending.mode=
  # web_identity). Off by default (plain dev needs no STS). Enabling it rolls RustFS (emptyDir → data wipes).
  oidc:
    enabled: false
    rolePolicy: readwrite # built-in full-S3 base policy; the per-request session policy narrows it per-table

# --- OpenBao (first-party template) — secret store, fronted by Dapr secretstores.* ------------------
openbao:
  enabled: true
  image: openbao/openbao:2.2.0
  port: 8200
  # devMode=true → in-memory, auto-unsealed, fixed root token (demo ONLY — anyone in-cluster can read
  # everything with `root`). Set devMode=false for the prod path: a sealed, file-backed server on a PVC
  # that an operator must `bao operator init` + unseal, with real auth — no fixed root token, no auto-seed.
  devMode: true
  devToken: root # dev-mode root token (devMode=true only)
  storage: 1Gi # PVC size for the prod (devMode=false) file backend
  # Externalize: when set, the Dapr secret store points at THIS Vault/OpenBao address instead of the
  # in-cluster server — pair with openbao.enabled=false to use an external Vault. The apps still consume
  # via Dapr (no plaintext fallback) because secretsViaDapr keys off this too.
  externalAddr: "" # e.g. https://vault.internal:8200

# --- external-secrets.io — sync the infra-tier Secret FROM Vault so NO plaintext secret ships in the chart.
# Requires the external-secrets operator in-cluster. When on, templates/external-secrets.yaml creates a
# SecretStore (→ vaultAddr) + an ExternalSecret that OWNS <release>-infra-credentials, and the static
# Secret in infra-credentials.yaml is skipped. Complements openbao.externalAddr (the app tier's Dapr path).
externalSecrets:
  enabled: false
  refreshInterval: "1h"
  kvMount: secret # the Vault KV mount path
  kvVersion: "v2"
  secretPath: lance # the KV key holding postgres-password + rustfs-secret-key (e.g. secret/data/lance)
  kubernetesAuthPath: kubernetes # the Vault Kubernetes auth backend mount
  role: lance-infra # the Vault role the operator's ServiceAccount assumes

# --- Observability — OTel-first: a single OpenTelemetry Collector is the telemetry hub, GreptimeDB the
# store, Perses the dashboards. GreptimeDB is ONE unified store for metrics+logs+traces (tables: metrics →
# PromQL series, opentelemetry_logs, opentelemetry_traces), backed by RustFS S3. The Collector RECEIVES app
# OTLP, TAILS infra-pod logs (filelog — retires Vector), and SCRAPES the Dapr sidecars (prometheus + k8s SD
# — the DaprConsumerWedge source), exporting everything OTLP → GreptimeDB (:4000/v1/otlp). Perses is
# dashboards-as-code over GreptimeDB's Prometheus-compatible API (:4000/v1/prometheus).
observability:
  enabled: true
  environment: kind # deployment.environment.name resource attr — override per deploy (kind / staging / prod)
  # OTel Collector — the single telemetry hub (receives app OTLP + tails infra logs + scrapes Dapr metrics).
  # enabled: deploy the in-cluster Collector (dev/kind). externalEndpoint: point at an operator-managed
  # external Collector instead (prod) — when set, NO in-cluster Collector is deployed and the apps + the
  # scrape config are that platform's concern; the chart just aims its OTLP export there. This is the
  # "we run the OTel operator + an external Collector; in Helm just point to the existing one" prod path.
  otelCollector:
    enabled: true
    image: otel/opentelemetry-collector-contrib:0.119.0
    externalEndpoint: "" # e.g. http://otel-collector.observability.svc:4318 — set in prod, deploys nothing
  # Legacy escape hatch: ship OTLP to an off-cluster endpoint AND run no in-cluster store. Prefer
  # otelCollector.externalEndpoint (the OTel-first prod path); this stays for a raw non-Collector target.
  externalOtlpEndpoint: "" # e.g. http://otel-collector.observability:4318/v1/otlp
  bucket: lance-observability # RustFS bucket for GreptimeDB object storage
  retention: "14d" # DB-level TTL on the `public` database (applied by greptimedb-ttl-job)
  greptimePort: 4000 # GreptimeDB HTTP: /v1/otlp (ingest), /v1/prometheus (query), /v1/sql, /health
  dbName: public # the GreptimeDB database all signals land in (x-greptime-db-name header)
  tracePipeline: greptime_trace_v1 # required pipeline header for OTLP trace ingestion → opentelemetry_traces
  samplingRate: "1" # Dapr trace sampling — full, so the catalog→lineage context always propagates
  # Alerting engine (P3b): vmalert evaluates chart/alerting/rules.yml against GreptimeDB's PromQL endpoint
  # (:4000/v1/prometheus) and routes firing alerts through Alertmanager. Default OFF (kind has no on-call);
  # values-prod flips it on. The rules are PROVEN to fire by `make alert-rules-check` (promtool); the live
  # query round-trip + a real receiver route are a prod drill. Set webhookUrl to your Slack/PagerDuty webhook.
  alerting:
    enabled: false
    vmalertImage: victoriametrics/vmalert:v1.106.1
    alertmanagerImage: prom/alertmanager:v0.28.0
    evaluationInterval: "1m"
    webhookUrl: "" # empty → Alertmanager still receives + groups alerts, but pages nowhere (black-hole)
  # Infra-tier metrics (Dapr sidecar :9090 → the DaprConsumerWedge signal) are collected by the OTel
  # Collector's `prometheus` receiver (k8s SD) once the OpenTelemetry operator lands — NOT a bespoke scraper.
  # An earlier vmagent was removed as a redundant third collector: the single OTel Collector already tails
  # infra logs (filelog) AND receives the app OTLP, so it subsumes all three. The DaprConsumerWedge alert rule
  # (chart/alerting/rules.yml) is defined + promtool-proven and evaluates as soon as the Collector feeds
  # dapr_* into GreptimeDB. See docs/OPERATORS.md (the OTel operator row).
  # Edge auth (§5e hardening) — nginx `auth_basic` on the gateway's /perses/ + /greptime/ locations.
  # BOTH are otherwise UNAUTHENTICATED: Perses is the dashboard, and GreptimeDB exposes its RAW SQL/ingest
  # API on :4000 — and in prod the Ingress→gateway proxies both publicly (a wide-open telemetry store +
  # dashboard). This closes that hole AT THE EDGE without touching GreptimeDB's own `auth.enabled` (which
  # would force EVERY client — the app OTLP exporters, Dapr tracing, the OTel Collector's exporter, the Perses
  # datasource proxy — to carry credentials; that full GreptimeDB `auth.enabled` + Perses OIDC is the
  # documented follow-on). Default OFF so local dev / `make dashboards` stays unauthenticated + frictionless;
  # values-prod flips it TRUE to close the prod hole. Completion condition (#5e): an unauthenticated request
  # to /greptime/ or /perses/ is rejected at the gateway.
  edgeAuth:
    enabled: false
    # The realm shown on the browser basic-auth prompt (not a secret).
    realm: "lance observability"
    # The htpasswd LINE(S) (`user:hash`) for the basic-auth file. INFRA-TIER credential (the two-tier
    # secret model): NOT stored here as plaintext — it lands ONLY in the `<release>-observability-edge-auth`
    # k8s Secret (templates/observability.yaml) and is mounted read-only into the gateway as the
    # `auth_basic_user_file` (never a pod env/arg value). Empty by default; the render FAILS CLOSED when
    # edgeAuth.enabled with no htpasswd supplied, so provide it out-of-band in prod:
    # `--set observability.edgeAuth.htpasswd=…` sourced from OpenBao / external-secrets (an apr1/bcrypt
    # hash — e.g. `htpasswd -nbB observer <pw>`).
    htpasswd: ""

# GreptimeDB standalone subchart — unified metrics/logs/traces store on the in-cluster RustFS S3.
greptimedb-standalone:
  objectStorage:
    s3:
      bucket: lance-observability
      region: us-east-1
      root: /greptimedb
      endpoint: http://lance-ns-rustfs:9000
    credentials:
      existingSecretName: lance-ns-observability-s3

# Vector is gone — the OTel Collector's filelog receiver (templates/otel-collector.yaml) tails the infra-pod
# logs now, dropping the app pods (lance.dev/logs=otlp) that already ship OTLP logs. Infra logs land in
# GreptimeDB's `opentelemetry_logs` (via OTLP), not the old Vector-specific `lance_logs` table.

# Perses subchart — dashboards-as-code over GreptimeDB's Prometheus-compatible API.
perses:
  # Perses extracts its datasource/panel plugins to /etc/perses/plugins at startup, but the container is
  # readOnlyRootFilesystem → that path isn't writable → datasource provisioning fails. Give it an
  # emptyDir there (keeps readOnlyRootFilesystem true).
  volumes:
    - name: perses-plugins
      emptyDir: {}
    - name: perses-dashboards
      configMap:
        name: lance-ns-perses-dashboards
  volumeMounts:
    - name: perses-plugins
      mountPath: /etc/perses/plugins
    - name: perses-dashboards
      mountPath: /etc/perses/dashboards
  # PROXY mode (not directUrl): the in-cluster GreptimeDB DNS name is unreachable from a browser on a
  # port-forward, so route queries through the Perses server which can resolve it.
  datasources:
    - kind: GlobalDatasource
      metadata:
        name: greptimedb
      spec:
        default: true
        plugin:
          kind: PrometheusDatasource
          spec:
            proxy:
              kind: HTTPProxy
              spec:
                url: http://lance-ns-greptimedb-standalone:4000/v1/prometheus
  config:
    provisioning:
      folders:
        - /etc/perses/provisioning
        - /etc/perses/datasources
        - /etc/perses/dashboards
      interval: 1m

# --- The three app services ------------------------------------------------------------------------
services:
  catalog:
    module: catalog.main:app
    port: 2333
    daprAppId: catalog
    replicas: 1 # stateless — scale freely in prod (the prod overlay bumps these); HA via podDisruptionBudget
  lineage:
    module: lineage.main:app
    port: 8000
    daprAppId: lineage
    # Freshness budget in HOURS (data-contract gap #2): >0 makes the reconcile sweep + per-dataset
    # GET flag `stale: true` for any dataset whose newest version commit is older — arrival cadence
    # becomes an ASSERTED contract clause (WARN `lineage_reconcile_stale` on the tick). 0 = off.
    freshnessBudgetHours: 0
    # Safe to scale: the app's own pubsub component carries queueGroupName=lineage, so replicas form a
    # competing-consumer group (single delivery per event); ingest is idempotent anyway (MERGE on run_id).
    replicas: 1
    # Demo data-peek router (/demo/*: live Lance schema/versions/rows for the UI) — DEMO ONLY: the
    # endpoints carry no OIDC/FGA guard, so they'd disclose dataset metadata past the governance layer
    # (reachable unauthenticated through the web BFF — bug hunt 2026-07-13). SECURE-BY-DEFAULT off; a demo
    # opts in with `--set services.lineage.demoData=true`. The router is only mounted when true.
    demoData: false
    # Periodic storage->graph reconciliation (B4) — a Dapr cron binding POSTs to /<bindingName> on `schedule`
    # to back-fill Lance writes whose lineage event was lost (the outbox gap). Off by default (the demo ships
    # without it); the /datasets/{name}/reconcile read endpoint is available regardless.
    reconcile:
      enabled: false
      bindingName: lineage-reconcile-cron
      schedule: "@every 300s" # demo cadence (prod: e.g. "0 */15 * * * *")
    # #4 transactional outbox: producers stage each lineage event to s3://<rustfs.bucket>/_lineage_outbox
    # BEFORE the fire-and-forget publish; the reconcile sweep DRAINS any survivor (a crash between the Lance
    # commit and the publish), re-ingesting the FULL event (inputs/author/columnLineage) — closing the loss
    # window the DLQ + version-only back-fill cannot. Requires reconcile.enabled (the drain runs in the sweep).
    outbox:
      enabled: false
    # Run-node retention (§4): the reconcile cron prunes graph :Run nodes older than this many days
    # (batched DETACH DELETE under the sweep's single-flight lock). 0 = off — keep full provenance
    # (the dev/demo default). Only meaningful with reconcile.enabled (the cron is the pruner).
    runRetentionDays: 0
    # Server-side per-statement timeout (seconds) on the AGE pool — bounds a runaway Cypher traversal.
    ageStatementTimeoutSeconds: 30

# Web (SvelteKit UI) replica count — stateless. (Demo scaffolding; rask supplies the real frontends.)
web:
  # Deploy the SvelteKit UI. Default true = the current behavior (it always deployed, ungated). A headless
  # stack turns it OFF: `scripts/e2e_stack.sh` needs that, and until this key existed its --set was a silent
  # no-op — the web pod deployed, could not pull its (never-built) image, and blocked `helm --wait` forever.
  enabled: true
  replicas: 1
  # The bare FGA subject the BFF names when it reads lineage as a SERVICE on the auth-on stack (no user
  # session). Must be READER on the warehouse (seed_medallion_fga.sh) + allowlisted in
  # LINEAGE_SERVICE_SUBJECTS (rendered on lineage when auth.enabled). Lets the read-only UI show the graph
  # without a per-user browser login; per-user OIDC login still takes precedence when a user IS signed in.
  serviceIdentity: service-web
  # Per-user OIDC LOGIN for the UI (opt-in). The demo default is OFF: the web reads lineage as
  # serviceIdentity, and catalog control-plane surfaces show "sign in" (no login is possible). Turn ON only
  # with a BROWSER-REACHABLE IdP + web origin — an ingress with real DNS, or a port-forward + /etc/hosts —
  # because the browser is redirected to the IdP's authorize endpoint and back to publicOrigin/auth/callback;
  # the in-cluster `dex.issuer` is NOT browser-reachable. When on, the BFF forwards each signed-in user's OWN
  # bearer to the governed backends (per-user authz) and the session cookie is sealed (sessionSecret). The
  # client is public (PKCE), so no client secret is wired. Provider-agnostic: point publicIssuer at Dex,
  # Keycloak, Auth0, etc. — the frontend uses OIDC discovery, no code change.
  oidc:
    enabled: false
    publicIssuer: "" # browser-reachable IdP issuer, e.g. https://auth.example.com/dex or a Keycloak realm URL
    publicOrigin: "" # browser-reachable web origin, e.g. https://app.example.com (forms the redirect URI)
    sessionSecret: "" # >=32 random chars; seals the session cookie (AES-256-GCM). REQUIRED when enabled.

# --- HA: PodDisruptionBudget + (optional) HPA for the stateless request-serving services. Off by default
# (single-node kind); the prod overlay turns the PDB on. Stateful stores (AGE/RustFS) get HA from their
# operators in rask (CNPG / rustfs-operator), NOT from here. ----------------------------------------
podDisruptionBudget:
  enabled: false
  minAvailable: 1
autoscaling:
  enabled: false # opt-in; needs metrics-server. Targets catalog + lineage.
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Dapr pub/sub: the publish-side component name + the lineage topic. Each SUBSCRIBER app additionally
# gets its own derived component `<name>-<app-id>` carrying its queue group + deliver policy
# (dapr-component.yaml); the subscription routes live in app code (/lineage-events, /raw-arrival,
# /medallion-event).
pubsub:
  name: lineage-pubsub
  topic: lineage.events.v1

# --- Event-driven medallion pipeline (raw → bronze → silver → gold) --------------------------------
# lance-ray (dummy producer) is the HEAD: POST /produce emits the raw_events lineage + the first trigger
# (medallion.raw). Each mover subscribes to its upstream stage's trigger, emits the transform's lineage
# (the DERIVED_FROM edge), and publishes the next trigger — one source event cascades the whole DAG, and
# Dapr propagates the trace context across every hop. All 5 share the catalog image (different entrypoint).
medallion:
  enabled: true
  port: 8000
  # Storage ZONES (ingest SOURCE → medallion → gold SINK). Maps a stage NAMESPACE to its S3 bucket;
  # anything unset falls back to the shared `rustfs.bucket`, so the DEFAULT here is the single-bucket
  # layout (unchanged, e2e-safe). Override to separate the boundaries — raw (ingest source) and gold
  # (sink/output) into their OWN buckets/tenants, while bronze/silver (the project's medallion internals)
  # stay in the project bucket. Any non-default bucket listed here is auto-provisioned by rustfs-mkbucket.
  # Same RustFS endpoint/creds serve all buckets; a truly external S3 per zone (own endpoint) is future.
  buckets: {} # e.g. { raw: lance-source, gold: lance-sink }
  # ReBAC enforcement: when true, each mover CHECKS it's authorized (OpenFGA) to produce its target stage
  # before emitting — the silver→gold mover needs `can_promote` (validator), the others `can_create_table`
  # (writer). Off by default (the open-mode demo runs without it); seed the mover-identity grants first
  # (scripts/seed_medallion_fga.sh) before flipping it on.
  fgaEnabled: false
  fgaApiUrl: http://lance-ns-openfga:8080
  # #64 human trigger door: the project a signed-in user must hold `can_administer` on to fire /produce or
  # /train from the UI (the web BFF forwards ONLY the user's bearer — no service token leaves the web pod).
  # The service-to-service app-token path is unchanged; this is a SECOND, admin-only door, gated on
  # auth.enabled + fga. Matches the project the seed grants admin on (scripts/e2e_stack.sh → project:acme).
  produceAdminProject: acme
  # Replica counts — each mover's own pubsub component carries queueGroupName=<app-id>, so its replicas
  # form a competing-consumer group (single delivery per trigger; without the queue group every replica
  # would process EVERY trigger — up to 8× at gold with 2 replicas per stage). Movers are idempotent on
  # top (MERGE on run_id). lance-ray is a subscriber too (/raw-arrival). All stateless.
  producerReplicas: 1
  moverReplicas: 1
  # When true, every stage does a REAL in-process Lance read->transform->write (the fake-Ray compute) so the
  # event-driven cascade produces actual versioned data on RustFS, not just provenance — the lineage graph
  # then reflects what storage holds and outputStatistics carry real rows/bytes. Off by default (the demo
  # ships as a pure lineage-emit). Each stage's FROM_URI/TO_URI derive from rustfs.bucket + its namespace, so
  # the chain lines up (producer raw -> raw->bronze -> bronze->silver -> silver->gold). REQUIRES OpenBao off
  # (`--set openbao.enabled=false`): the medallion is a dummy producer with no OpenBao secret-fetch (unlike
  # the catalog), so with OpenBao on the plaintext S3 secret is withheld and it fails fast at boot. Real
  # compute is a Ray job at rask.
  compute: false
  # Media head demo seeding: /ingest-media writes two sample PNGs into the source prefix before
  # ingesting (the stand-in for an external media drop). Prod points the source at real media and
  # sets this false. Prefix/topic/dataset names use the code defaults.
  mediaSeedSamples: true
  # Event-driven REAL-Ray compute (requires compute + a running Ray cluster — deploy/ray-lance-demo.yaml).
  # When true, each mover submits its stage transform as a `ray job submit` to the ray-lance cluster IN
  # RESPONSE TO its Dapr trigger (Ray Jobs REST API, httpx-only — no ray package in the mover image), instead
  # of the in-process fake-Ray write. Default off — fake-Ray in-process stays the default. Production is
  # KubeRay (RayCluster CR) at the rask merge; the raw Ray head here is the on-kind proof. See docs/RAY.md.
  ray: false
  rayAddress: "http://ray-lance-head:8265"
  # When true, after the compute writes a stage's Lance dataset the mover runs data-quality assertions on it
  # (row_count > 0, key column non-null) and BLOCKS promotion on failure — the failed run + its
  # dataQualityAssertions facet are still emitted (auditable in lineage), but the next stage is NOT
  # triggered, so a bad batch can't cascade. The automated *validator* half of governance (FGA decides who
  # MAY promote; quality decides if the DATA is good enough). Requires medallion.compute (no data to check
  # otherwise). Off by default.
  quality: false
  qualityKeyColumn: id
  # Ray TRAIN head (#115, docs/RAY-TRAIN.md): values-wired passthrough for the /train head + the
  # submit-and-ack trainer consumer (both live in the lance-ray app). Defaults mirror
  # services/medallion/core/config.py so a deployment can retarget topic/entrypoint/identity/registry
  # namespace without an image rebuild. lineageUrl empty = release-derived
  # (http://<release>-lineage:<port>) — set it only to point the training job's self-emitted
  # RunEvents elsewhere ("" in the CODE default disables emission; the chart always renders a URL).
  train:
    topic: training.jobs
    entrypoint: "python /home/ray/jobs/ray_train_job.py"
    trainerIdentity: service-trainer
    modelsNamespace: models
    lineageUrl: ""
  producer:
    daprAppId: lance-ray
    # Expose POST /produce through the gateway (the DEMO entry point for the cascade). It carries no
    # auth — a caller could trigger cascades / forge medallion provenance — so values-prod sets it false;
    # the EDGE head then fires only from real raw writes via /raw-arrival. NB this gates only the gateway
    # route — the in-cluster ClusterIP route stays reachable + unauthenticated (see docs/MEDALLION.md).
    expose: true
    rawDataset: raw_events
    rawNamespace: raw
    operation: lance_ray_ingest
    author: ray
    rawTopic: medallion.raw
  # The 4 stage movers run medallion.mover:app, differing only by env. order = the DAG.
  # requiredAction/serviceIdentity gate each hop when fgaEnabled: silver→gold needs `can_promote`
  # (validator-only); the others `can_create_table` (writer). Each mover checks as its own identity.
  movers:
    # serviceIdentity is a BARE subject — common.fga.check prefixes `user:` itself (a `user:` here would
    # double-prefix and always deny). The seeded FGA tuples grant these `user:service-*` identities.
    # Optional per-mover `requiredColumns: "id,embedding"` — declared consumer dependencies
    # (data-contract gap #1): the quality gate adds a `column_declared` assertion per name, so a
    # promotion that dropped/renamed a declared column is BLOCKED (the breaking-change detector).
    - { name: raw-to-bronze, daprAppId: raw-to-bronze, fromNamespace: raw, fromDataset: raw_events, toNamespace: bronze, toDataset: bronze$events, operation: ingest_events, author: alice, subTopic: medallion.raw, pubTopic: medallion.bronze, requiredAction: can_create_table, serviceIdentity: "service-raw-to-bronze" }
    - { name: bronze-to-silver, daprAppId: bronze-to-silver, fromNamespace: bronze, fromDataset: bronze$events, toNamespace: silver, toDataset: silver$features, operation: embed_features, author: data_eng, subTopic: medallion.bronze, pubTopic: medallion.silver, requiredAction: can_create_table, serviceIdentity: "service-bronze-to-silver", requiredColumns: "id" }
    - { name: silver-to-gold, daprAppId: silver-to-gold, fromNamespace: silver, fromDataset: silver$features, toNamespace: gold, toDataset: gold$catalog, operation: aggregate_gold, author: analyst, subTopic: medallion.silver, pubTopic: "", requiredAction: can_promote, serviceIdentity: "service-silver-to-gold", requiredColumns: "id" }
    # The MEDIA lane (multimodal §9): POST /ingest-media on lance-ray lands bronze-media blobs and
    # publishes medallion.media; this mover's generic compute then derives what the blob CONTENT
    # supports (image → inline thumbnail + embedding; unrecognised media carries through untouched —
    # no media config anywhere, the same binary as every mover). Terminal (pubTopic ""). Own
    # namespaces: mover URIs derive from the namespace, so reusing bronze/silver would collide with
    # the events chain's datasets on the same paths.
    - { name: media-to-silver, daprAppId: media-to-silver, fromNamespace: bronze-media, fromDataset: bronze-media$objects, toNamespace: silver-media, toDataset: silver-media$features, operation: derive_media, author: data_eng, subTopic: medallion.media, pubTopic: "", requiredAction: can_create_table, serviceIdentity: "service-media-to-silver", requiredColumns: "id,thumbnail,embedding" }

# --- Compaction/GC microservice (Dapr cron binding) -----------------------------------------------
# A bindings.cron component POSTs /<bindingName> on `schedule`; the service compacts small Lance
# fragments + GCs old versions across the lakehouse bucket. Schedule/retention are component config.
compaction:
  enabled: true
  daprAppId: compaction
  port: 8000
  bindingName: compaction-cron
  schedule: "@every 120s" # demo cadence (prod: e.g. "0 */30 * * * *")
  olderThanDays: 7 # version GC keeps this much history
  # Emit a maintenance lineage event per materially-compacted dataset (shows GC in producers() next to
  # writes) AND a FAIL event per maintain:-errored dataset (deterministic per-dataset run id — the flood
  # guard). Off by default (opt-in, like the medallion toggles); on → compaction joins the pubsub scope +
  # publishes. NOTE: the compaction FAILURE surface (§4 visibility) exists only when this is ON — left
  # off, a persistently failing dataset is visible only in OTel spans + the cron response body. When ON,
  # also consider services.lineage.runRetentionDays > 0: a recovered dataset's FAIL Run node otherwise
  # persists in /runs indefinitely (the deterministic id means exactly one node per dataset).
  lineageEmit: false

# --- Backups — a FALLBACK for the SELF-CONTAINED in-cluster path only. OFF by default. When you run the
# managed/operator path (CloudNativePG for AGE, rustfs-operator for S3 — the rask deployment), DISABLE these
# and let the operators do backups (PITR + scheduled, better than this). These exist so a self-contained
# in-cluster-prod deploy (in-cluster RustFS PVC + AGE) isn't backup-less. -----------------------------------
backups:
  # pg_dump the lineage + OpenFGA DBs (gzip) → the lakehouse S3 under _backups/pg/<date>/.
  pgDump:
    enabled: false
    schedule: "0 2 * * *" # daily 02:00
    keep: 7 # retention: prune all but the newest N daily dumps each run, so the backups don't grow unbounded
  # CSI VolumeSnapshot of the RustFS lakehouse PVC. Needs a CSI snapshotter + a VolumeSnapshotClass.
  volumeSnapshot:
    enabled: false
    schedule: "0 3 * * *" # daily 03:00
    snapshotClassName: "" # the cluster's VolumeSnapshotClass; "" = the cluster default
    kubectlImage: bitnami/kubectl:1.31 # creates the VolumeSnapshot CR (override to your cluster's kubectl image)

# --- API gateway — single entry point (reverse proxy) ---------------------------------------------
# One nginx that path-routes to the in-cluster services, so a single `kubectl port-forward` fronts the
# whole platform (kind has no host ports). Non-root nginx-unprivileged (listens on 8080). In prod this
# Service sits behind a real k8s Ingress; the routing table is the same.
gateway:
  enabled: true
  image: nginxinc/nginx-unprivileged:1.27-alpine
  port: 8080
  daprAppId: gateway # app traffic is routed via this sidecar's Dapr service-invocation API (:3500)
  replicas: 1 # stateless nginx reverse proxy — scale freely

resources:
  default:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# --- Ingress — fronts the gateway Service in prod (kind uses a port-forward instead) ---------------
ingress:
  enabled: false
  className: "" # e.g. nginx / traefik; "" omits ingressClassName → the cluster's default IngressClass
  host: "" # e.g. lance.example.com; "" → a host-less rule that matches any host
  annotations: {} # e.g. cert-manager.io/cluster-issuer, nginx.ingress.kubernetes.io/*
  tls: [] # e.g. [{ secretName: lance-tls, hosts: ["lance.example.com"] }]
